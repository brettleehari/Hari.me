<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari's Corner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1419;
            color: #e0e6ed;
            line-height: 1.6;
        }
        a { color: #7dd3fc; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #38bdf8; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        /* Header */
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky; top: 0;
            background: rgba(15,20,25,0.97);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
        nav { display: flex; gap: 8px; flex-wrap: wrap; }
        nav a {
            font-size: 13px; color: #6b7280; padding: 4px 10px;
            border-radius: 4px; transition: all 0.2s;
        }
        nav a:hover { color: #e0e6ed; background: rgba(255,255,255,0.06); }

        /* Hero */
        .hero { padding: 72px 0 48px; text-align: center; }
        .hero h1 { font-size: clamp(32px,5vw,48px); font-weight: 700; margin-bottom: 12px; letter-spacing: -1px; color: #fff; }
        .hero .tagline { font-size: 15px; color: #9ca3af; max-width: 680px; margin: 0 auto 20px; line-height: 1.7; }
        .hero .location { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
        .hero-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .hero-links a {
            padding: 6px 12px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; font-size: 12px; color: #9ca3af; transition: all 0.2s;
        }
        .hero-links a:hover { border-color: rgba(125,211,252,0.4); color: #7dd3fc; background: rgba(125,211,252,0.06); }

        /* Sections */
        section { margin-bottom: 72px; }
        .section-header { margin-bottom: 32px; }
        .section-header h2 {
            font-size: 22px; font-weight: 700; color: #fff;
            display: flex; align-items: center; gap: 10px;
        }
        .section-header h2 .section-line {
            flex: 1; height: 1px; background: rgba(255,255,255,0.08);
        }
        .section-sub { font-size: 14px; color: #6b7280; margin-top: 8px; }

        /* About */
        .about-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .about-text p { font-size: 14px; color: #d1d5db; line-height: 1.8; margin-bottom: 14px; }
        .callout-box {
            background: rgba(125,211,252,0.06); border: 1px solid rgba(125,211,252,0.15);
            border-radius: 8px; padding: 20px;
        }
        .callout-box h3 { font-size: 14px; font-weight: 600; color: #7dd3fc; margin-bottom: 6px; }
        .callout-box p { font-size: 13px; color: #d1d5db; line-height: 1.7; margin: 0; }

        /* Interactive Timeline */
        .timeline-wrapper { position: relative; }
        .timeline-filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .timeline-filter {
            font-size: 12px; padding: 4px 12px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); background: none;
            color: #6b7280; cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        .timeline-filter:hover { border-color: rgba(255,255,255,0.2); color: #d1d5db; }
        .timeline-filter.active { border-color: var(--cat-color, #7dd3fc); color: var(--cat-color, #7dd3fc); background: var(--cat-bg, rgba(125,211,252,0.08)); }

        .timeline-track { position: relative; padding-left: 40px; }
        .timeline-track::before {
            content: ''; position: absolute; left: 15px; top: 0; bottom: 0;
            width: 1px; background: rgba(255,255,255,0.08);
        }
        .tl-node {
            position: relative; margin-bottom: 8px;
            transition: opacity 0.3s, transform 0.3s;
        }
        .tl-node.hidden { opacity: 0; height: 0; margin: 0; overflow: hidden; transform: translateY(-8px); }
        .tl-dot {
            position: absolute; left: -33px; top: 12px;
            width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid var(--cat-color, #7dd3fc);
            background: #0f1419; transition: all 0.2s; z-index: 2;
        }
        .tl-node:hover .tl-dot, .tl-node.open .tl-dot {
            background: var(--cat-color, #7dd3fc);
            box-shadow: 0 0 8px var(--cat-color, rgba(125,211,252,0.4));
        }
        .tl-head {
            display: flex; align-items: baseline; gap: 12px;
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            transition: background 0.2s;
        }
        .tl-head:hover { background: rgba(255,255,255,0.03); }
        .tl-year { font-size: 13px; font-weight: 700; color: var(--cat-color, #7dd3fc); min-width: 40px; }
        .tl-label { font-size: 14px; font-weight: 600; color: #e0e6ed; }
        .tl-cat-badge {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: var(--cat-bg, rgba(125,211,252,0.1));
            color: var(--cat-color, #7dd3fc); text-transform: uppercase;
            letter-spacing: 0.5px; font-weight: 600; white-space: nowrap;
        }
        .tl-expand-icon {
            margin-left: auto; font-size: 12px; color: #6b7280;
            transition: transform 0.2s;
        }
        .tl-node.open .tl-expand-icon { transform: rotate(90deg); }
        .tl-body {
            max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.35s ease;
            padding: 0 16px;
        }
        .tl-node.open .tl-body { max-height: 400px; padding: 8px 16px 16px; }
        .tl-body p { font-size: 13px; color: #9ca3af; line-height: 1.7; margin-left: 52px; }

        /* Category colors */
        [data-cat="career"] { --cat-color: #a78bfa; --cat-bg: rgba(167,139,250,0.1); }
        [data-cat="opensource"] { --cat-color: #34d399; --cat-bg: rgba(52,211,153,0.1); }
        [data-cat="research"] { --cat-color: #fbbf24; --cat-bg: rgba(251,191,36,0.1); }
        [data-cat="product"] { --cat-color: #f87171; --cat-bg: rgba(248,113,113,0.1); }
        [data-cat="writing"] { --cat-color: #60a5fa; --cat-bg: rgba(96,165,250,0.1); }

        /* Beliefs */
        .beliefs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .belief-item {
            background: rgba(255,255,255,0.03); border-left: 2px solid rgba(125,211,252,0.3);
            padding: 16px 20px; border-radius: 0 6px 6px 0; transition: all 0.2s;
        }
        .belief-item:hover { background: rgba(125,211,252,0.05); border-left-color: #7dd3fc; }
        .belief-text { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .belief-sub { font-size: 12px; color: #9ca3af; line-height: 1.5; }

        /* Project Cards */
        .project-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .project-tab {
            font-size: 12px; padding: 5px 14px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); background: none;
            color: #6b7280; cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        .project-tab:hover { border-color: rgba(255,255,255,0.2); color: #d1d5db; }
        .project-tab.active { border-color: #7dd3fc; color: #7dd3fc; background: rgba(125,211,252,0.08); }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 24px; transition: all 0.2s; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .card:hover { border-color: rgba(125,211,252,0.25); background: rgba(125,211,252,0.03); }
        .card .card-year { font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #fff; }
        .card .card-oneliner { font-size: 13px; color: #7dd3fc; margin-bottom: 10px; line-height: 1.5; }
        .card-detail { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .card.expanded .card-detail { max-height: 600px; }
        .card-detail p { font-size: 13px; color: #d1d5db; margin-bottom: 8px; line-height: 1.6; }
        .card-detail .card-insight { font-size: 12px; color: #9ca3af; font-style: italic; margin-top: 8px; line-height: 1.5; }
        .card-detail .card-results { font-size: 12px; color: #7dd3fc; font-weight: 500; margin-top: 8px; }
        .card-links { margin-top: 10px; }
        .card-links a { font-size: 12px; margin-right: 14px; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .tag {
            display: inline-block; background: rgba(255,255,255,0.06);
            color: #9ca3af; padding: 2px 8px; border-radius: 3px;
            font-size: 11px; font-weight: 500;
        }
        .card-expand-hint { font-size: 11px; color: #4b5563; margin-top: 10px; }
        .card.expanded .card-expand-hint { display: none; }

        /* OSS */
        .oss-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 24px; }
        .oss-card {
            background: rgba(52,211,153,0.04); border: 1px solid rgba(52,211,153,0.12);
            border-radius: 8px; padding: 20px;
        }
        .oss-card h4 { font-size: 14px; font-weight: 600; color: #34d399; margin-bottom: 4px; }
        .oss-card .oss-year { font-size: 11px; color: #6b7280; margin-bottom: 6px; }
        .oss-card p { font-size: 12px; color: #d1d5db; line-height: 1.6; }

        /* Background + Research */
        .bg-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 28px; margin-bottom: 24px;
        }
        .bg-card p { font-size: 14px; line-height: 1.8; color: #d1d5db; }
        .stats-row { display: flex; gap: 32px; margin-top: 20px; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat-number { font-size: 24px; font-weight: 700; color: #7dd3fc; }
        .stat-label { font-size: 11px; color: #6b7280; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .frameworks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
        .fw-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 16px;
        }
        .fw-item h4 { font-size: 13px; font-weight: 600; color: #7dd3fc; margin-bottom: 4px; }
        .fw-item p { font-size: 12px; color: #9ca3af; line-height: 1.5; }

        /* Book */
        .book-card {
            display: flex; gap: 24px; align-items: center;
            background: rgba(251,191,36,0.04); border: 1px solid rgba(251,191,36,0.15);
            border-radius: 8px; padding: 24px; margin-bottom: 24px;
        }
        .book-icon { font-size: 40px; line-height: 1; opacity: 0.7; }
        .book-info h3 { font-size: 16px; font-weight: 600; color: #fbbf24; margin-bottom: 4px; }
        .book-info .book-meta { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
        .book-info p { font-size: 13px; color: #d1d5db; line-height: 1.6; }

        /* Speaking */
        .speaking-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .speaking-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 16px;
        }
        .speaking-item h4 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .speaking-item .speak-date { font-size: 11px; color: #7dd3fc; margin-bottom: 4px; }
        .speaking-item p { font-size: 12px; color: #9ca3af; line-height: 1.5; }

        /* Writing */
        .writing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
        .writing-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 16px; transition: all 0.2s;
        }
        .writing-card:hover { border-color: rgba(125,211,252,0.2); }
        .writing-card h3 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .writing-card .writing-meta { font-size: 11px; color: #7dd3fc; margin-bottom: 4px; }
        .writing-card p { font-size: 12px; color: #9ca3af; line-height: 1.5; }

        /* Now */
        .now-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .now-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 18px; transition: border-color 0.2s;
        }
        .now-card:hover { border-color: rgba(125,211,252,0.2); }
        .now-card h3 { font-size: 13px; font-weight: 600; color: #7dd3fc; margin-bottom: 6px; }
        .now-card p { font-size: 13px; color: #d1d5db; line-height: 1.6; }

        /* Reading */
        .reading-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .reading-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 20px;
        }
        .reading-card h3 { font-size: 14px; font-weight: 600; color: #7dd3fc; margin-bottom: 10px; }
        .reading-card ul { list-style: none; padding: 0; }
        .reading-card li {
            font-size: 13px; color: #d1d5db; padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.5;
        }
        .reading-card li:last-child { border-bottom: none; }
        .reading-card li strong { color: #fff; }

        /* Tech */
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .tech-cat {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 16px;
        }
        .tech-cat h3 { font-size: 13px; font-weight: 600; color: #7dd3fc; margin-bottom: 8px; }
        .tech-cat p { font-size: 12px; color: #d1d5db; line-height: 1.7; }

        /* Education */
        .edu-grid { display: flex; gap: 16px; flex-wrap: wrap; }
        .edu-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; padding: 16px; flex: 1; min-width: 240px;
        }
        .edu-item h4 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .edu-item p { font-size: 12px; color: #9ca3af; }

        /* Footer */
        footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 48px 0 32px; text-align: center;
        }
        .footer-text { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
        .footer-links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .footer-links a { font-size: 12px; color: #6b7280; }
        .footer-links a:hover { color: #7dd3fc; }

        /* Responsive */
        @media (max-width: 768px) {
            nav { display: none; }
            .hero { padding: 48px 0 32px; }
            .hero h1 { font-size: 28px; }
            .cards, .beliefs-grid, .tech-grid, .now-grid, .reading-grid, .speaking-list, .writing-grid, .frameworks-grid, .oss-grid { grid-template-columns: 1fr; }
            .stats-row { gap: 20px; }
            .book-card { flex-direction: column; text-align: center; }
            .tl-head { padding: 8px 8px; }
            .tl-body p { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header><div class="container"><div class="header-content">
        <div class="logo" id="site-name"></div>
        <nav id="nav-links"></nav>
    </div></div></header>

    <main class="container">
        <section class="hero" id="hero"></section>
        <section id="about"></section>
        <section id="timeline-section"></section>
        <section id="believe"></section>
        <section id="build"></section>
        <section id="background"></section>
        <section id="book-speak"></section>
        <section id="write"></section>
        <section id="now"></section>
        <section id="read"></section>
        <section id="tech"></section>
        <section id="education"></section>
    </main>

    <footer><div class="container" id="footer-content"></div></footer>

    <script>
    fetch('data/portfolio.json')
        .then(r => r.json())
        .then(render)
        .catch(() => {
            document.querySelector('main').innerHTML = '<p style="text-align:center;padding:80px 20px;color:#6b7280;">Failed to load portfolio data.</p>';
        });

    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function sectionHead(title, sub) {
        return `<div class="section-header"><h2>${esc(title)} <span class="section-line"></span></h2>${sub ? `<p class="section-sub">${esc(sub)}</p>` : ''}</div>`;
    }

    function render(d) {
        document.getElementById('site-name').textContent = d.site.name;
        document.title = d.site.name;

        // Nav
        const nav = [
            ['about','About'],['timeline-section','Journey'],['believe','Beliefs'],
            ['build','Build'],['background','Research'],['book-speak','Book'],
            ['write','Write'],['now','Now'],['read','Read'],['tech','Stack']
        ];
        document.getElementById('nav-links').innerHTML = nav.map(([id,label]) =>
            `<a href="#${id}">${label}</a>`).join('');

        // Hero
        document.getElementById('hero').innerHTML = `
            <h1>${esc(d.person.full_name)}</h1>
            <p class="tagline">${esc(d.person.headline)}</p>
            <p class="location">${esc(d.person.origin)} &rarr; ${esc(d.person.current_location)}</p>
            <div class="hero-links">
                ${d.profiles.map(p => `<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`).join('')}
            </div>`;

        // About
        document.getElementById('about').innerHTML = `
            ${sectionHead('About')}
            <div class="about-grid">
                <div class="about-text">
                    <p>${esc(d.about.thesis)}</p>
                    <p>${esc(d.about.arc)}</p>
                </div>
                <div class="callout-box">
                    <h3>What I'm Looking For</h3>
                    <p>${esc(d.about.looking_for)}</p>
                </div>
            </div>`;

        // Timeline - interactive expandable
        const cats = [...new Set(d.timeline.map(t => t.category))];
        const catLabels = {career:'Career',opensource:'Open Source',research:'Research',product:'Product',writing:'Writing'};
        const filters = `<button class="timeline-filter active" data-filter="all">All</button>` +
            cats.map(c => `<button class="timeline-filter" data-filter="${c}" style="--cat-color:var(--cat-color);--cat-bg:var(--cat-bg)" data-cat="${c}">${catLabels[c]||c}</button>`).join('');

        const nodes = d.timeline.slice().reverse().map(t => `
            <div class="tl-node" data-cat="${esc(t.category)}">
                <div class="tl-dot"></div>
                <div class="tl-head" onclick="this.parentElement.classList.toggle('open')">
                    <span class="tl-year">${esc(String(t.year))}</span>
                    <span class="tl-label">${esc(t.label)}</span>
                    <span class="tl-cat-badge">${esc(catLabels[t.category]||t.category)}</span>
                    <span class="tl-expand-icon">&#9654;</span>
                </div>
                <div class="tl-body"><p>${esc(t.description)}</p></div>
            </div>
        `).join('');

        document.getElementById('timeline-section').innerHTML = `
            ${sectionHead('The Journey', '20 years. Click any milestone to expand.')}
            <div class="timeline-wrapper">
                <div class="timeline-filters">${filters}</div>
                <div class="timeline-track">${nodes}</div>
            </div>`;

        // Timeline filter logic
        document.querySelectorAll('.timeline-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.timeline-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const f = btn.dataset.filter;
                document.querySelectorAll('.tl-node').forEach(n => {
                    n.classList.toggle('hidden', f !== 'all' && n.dataset.cat !== f);
                });
            });
        });

        // Beliefs
        document.getElementById('believe').innerHTML = `
            ${sectionHead('What I Believe')}
            <div class="beliefs-grid">
                ${d.beliefs.map(b => `<div class="belief-item"><div class="belief-text">${esc(b.statement)}</div><div class="belief-sub">${esc(b.detail)}</div></div>`).join('')}
            </div>`;

        // Projects
        const pinnedProjects = d.projects.filter(p => p.pinned);
        const otherProjects = d.projects.filter(p => !p.pinned);

        function projectCard(p) {
            const links = [];
            if (p.repo_url) links.push(`<a href="${esc(p.repo_url)}" target="_blank">Repo</a>`);
            if (p.demo_url) links.push(`<a href="${esc(p.demo_url)}" target="_blank">Live Demo</a>`);
            if (p.writeup_url) links.push(`<a href="${esc(p.writeup_url)}" target="_blank">Write-up</a>`);
            if (p.model_url) links.push(`<a href="${esc(p.model_url)}" target="_blank">Model</a>`);
            if (p.dataset_url) links.push(`<a href="${esc(p.dataset_url)}" target="_blank">Dataset</a>`);
            return `
                <div class="card" onclick="this.classList.toggle('expanded')">
                    ${p.year_started ? `<div class="card-year">${esc(p.year_started)}${p.year_ended ? ' - ' + esc(p.year_ended) : ''} ${p.status ? '/ ' + esc(p.status) : ''}</div>` : ''}
                    <h3>${esc(p.name)}</h3>
                    ${p.one_liner ? `<div class="card-oneliner">${esc(p.one_liner)}</div>` : ''}
                    <div class="card-expand-hint">Click to expand</div>
                    <div class="card-detail">
                        ${p.what_it_does ? `<p>${esc(p.what_it_does)}</p>` : ''}
                        ${p.results ? `<div class="card-results">${esc(p.results)}</div>` : ''}
                        ${p.what_i_learned ? `<div class="card-insight">${esc(p.what_i_learned)}</div>` : ''}
                        ${links.length ? `<div class="card-links">${links.join('')}</div>` : ''}
                        ${p.tech_stack && p.tech_stack.length ? `<div class="card-tags">${p.tech_stack.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
                    </div>
                </div>`;
        }

        const ossHtml = d.open_source.map(o => `
            <div class="oss-card">
                <h4>${esc(o.project)}</h4>
                ${o.year ? `<div class="oss-year">${esc(String(o.year))}</div>` : ''}
                <p>${esc(o.contribution)}</p>
            </div>`).join('');

        document.getElementById('build').innerHTML = `
            ${sectionHead('What I Build', 'Click any card to see details.')}
            <h3 style="font-size:14px;font-weight:600;color:#7dd3fc;margin-bottom:12px;">Pinned</h3>
            <div class="cards">${pinnedProjects.map(projectCard).join('')}</div>
            ${otherProjects.length ? `<h3 style="font-size:14px;font-weight:600;color:#7dd3fc;margin:32px 0 12px;">More Projects</h3><div class="cards">${otherProjects.map(projectCard).join('')}</div>` : ''}
            <h3 style="font-size:14px;font-weight:600;color:#34d399;margin:32px 0 12px;">Open Source Contributions</h3>
            <div class="oss-grid">${ossHtml}</div>`;

        // Background + Research
        const fwHtml = d.research.frameworks_created.map(f => `
            <div class="fw-item"><h4>${esc(f.name)}</h4><p>${esc(f.description)}</p></div>`).join('');

        const patentHtml = d.research.patents.filter(p => p.title).map(p =>
            `<div class="fw-item"><h4>${esc(p.title)}</h4><p>Granted ${esc(p.year_granted)}. ${esc(p.one_line_summary)}</p></div>`).join('');

        document.getElementById('background').innerHTML = `
            ${sectionHead('Research, Patents, and Platform Work')}
            <div class="bg-card">
                <p>${esc(d.career_background.summary)}</p>
                <p style="margin-top:12px;font-style:italic;color:#9ca3af;">${esc(d.career_background.key_insight)}</p>
                <div class="stats-row">
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.patents)}</div><div class="stat-label">US Patents</div></div>
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.papers)}</div><div class="stat-label">Papers</div></div>
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.citations)}</div><div class="stat-label">Citations</div></div>
                    <div class="stat"><div class="stat-number">${esc(String(d.research.stats.years_in_idp))}</div><div class="stat-label">Years IDP</div></div>
                </div>
            </div>
            <h3 style="font-size:14px;font-weight:600;color:#fbbf24;margin-bottom:8px;">Patents</h3>
            <div class="frameworks-grid">${patentHtml}</div>
            <h3 style="font-size:14px;font-weight:600;color:#7dd3fc;margin:24px 0 8px;">Original Frameworks</h3>
            <div class="frameworks-grid">${fwHtml}</div>
            <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;">
                ${d.profiles.filter(p => p.platform === 'Google Scholar' || p.platform === 'ResearchGate')
                    .map(p => `<a href="${esc(p.url)}" target="_blank" style="font-size:13px;padding:6px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#9ca3af;">${esc(p.platform)}</a>`).join('')}
            </div>`;

        // Book + Speaking
        const bookHtml = d.book ? `
            <div class="book-card">
                <div class="book-icon">&#128214;</div>
                <div class="book-info">
                    <h3>${esc(d.book.title)}</h3>
                    <div class="book-meta">${esc(d.book.edition)}, ${esc(d.book.year)}</div>
                    <p>${esc(d.book.description)}</p>
                </div>
            </div>` : '';

        const speakHtml = d.speaking ? d.speaking.map(s => `
            <div class="speaking-item">
                <h4>${esc(s.event)}</h4>
                ${s.date ? `<div class="speak-date">${esc(s.date)}</div>` : ''}
                <p>${esc(s.topic)}</p>
            </div>`).join('') : '';

        document.getElementById('book-speak').innerHTML = `
            ${sectionHead('Book and Speaking')}
            ${bookHtml}
            <div class="speaking-list">${speakHtml}</div>`;

        // Writing
        document.getElementById('write').innerHTML = `
            ${sectionHead('What I Write')}
            <div class="writing-grid">
                ${d.writing.map(w => {
                    const meta = [];
                    if (w.type === 'series' && w.parts) meta.push(w.parts + '-part series');
                    if (w.platform) meta.push(w.platform);
                    if (w.date) meta.push(w.date);
                    const title = w.url ? `<a href="${esc(w.url)}" target="_blank">${esc(w.title)}</a>` : esc(w.title);
                    return `<div class="writing-card"><h3>${title}</h3>${meta.length ? `<div class="writing-meta">${esc(meta.join(' / '))}</div>` : ''}<p>${esc(w.summary)}</p></div>`;
                }).join('')}
            </div>`;

        // Now
        document.getElementById('now').innerHTML = `
            ${sectionHead('Now', 'Where my head is at right now.')}
            <div class="now-grid">
                ${d.now.items.map(n => `<div class="now-card"><h3>${esc(n.topic)}</h3><p>${esc(n.detail)}</p></div>`).join('')}
            </div>`;

        // Reading
        const ri = d.reading_and_interests;
        document.getElementById('read').innerHTML = `
            ${sectionHead('What I Read and What Moves Me')}
            <div class="reading-grid">
                <div class="reading-card"><h3>Thinkers Who Shaped Me</h3><ul>${ri.thinkers.map(t => `<li><strong>${esc(t.name)}</strong> &mdash; ${esc(t.influence)}</li>`).join('')}</ul></div>
                <div class="reading-card"><h3>What I Follow</h3><ul>${ri.topics_i_follow.map(t => `<li><strong>${esc(t.area)}</strong> &mdash; ${esc(t.specifics)}</li>`).join('')}</ul></div>
                <div class="reading-card"><h3>Interests Beyond Code</h3><ul>${ri.interests.map(i => `<li><strong>${esc(i.name)}</strong> &mdash; ${esc(i.depth)}</li>`).join('')}</ul></div>
            </div>`;

        // Tech
        document.getElementById('tech').innerHTML = `
            ${sectionHead('Tech Stack')}
            <div class="tech-grid">
                ${d.tech_stack.map(t => `<div class="tech-cat"><h3>${esc(t.category)}</h3><p>${t.tools.map(tool => esc(tool)).join(', ')}</p></div>`).join('')}
            </div>`;

        // Education
        document.getElementById('education').innerHTML = d.education ? `
            ${sectionHead('Education')}
            <div class="edu-grid">
                ${d.education.map(e => `<div class="edu-item"><h4>${esc(e.degree)}</h4><p>${esc(e.institution)}, ${esc(e.location)}</p></div>`).join('')}
            </div>` : '';

        // Footer
        document.getElementById('footer-content').innerHTML = `
            <p class="footer-text">${esc(d.footer.tagline)}</p>
            <div class="footer-links">
                ${d.profiles.map(p => `<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`).join('')}
            </div>`;
    }
    </script>
</body>
</html>
