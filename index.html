<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari's Corner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e6ed;
            line-height: 1.6;
        }

        a { color: #7dd3fc; text-decoration: none; transition: color 0.3s ease; }
        a:hover { color: #38bdf8; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        header {
            padding: 24px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky; top: 0;
            background: rgba(15,20,25,0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
        nav a { margin-left: 32px; font-size: 14px; color: #a0aec0; }
        nav a:hover { color: #7dd3fc; }

        .hero { padding: 80px 0 60px; text-align: center; }
        .hero h1 { font-size: clamp(36px,5vw,52px); font-weight: 700; margin-bottom: 16px; letter-spacing: -0.8px; }
        .hero .tagline { font-size: clamp(14px,1.5vw,16px); color: #9ca3af; max-width: 700px; margin: 0 auto 24px; line-height: 1.7; }
        .hero .location { font-size: 14px; color: #7dd3fc; font-weight: 500; margin-bottom: 32px; }

        .hero-links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .hero-links a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px; border: 1px solid rgba(125,211,252,0.3);
            border-radius: 6px; font-size: 13px; transition: all 0.3s ease;
        }
        .hero-links a:hover { border-color: #7dd3fc; background: rgba(125,211,252,0.1); }

        section { margin-bottom: 80px; }
        h2 {
            font-size: 28px; font-weight: 700; margin-bottom: 40px;
            padding-bottom: 12px; border-bottom: 2px solid rgba(125,211,252,0.3);
            display: inline-block;
        }
        .section-sub { font-size: 15px; color: #9ca3af; margin-bottom: 32px; margin-top: -24px; line-height: 1.7; }

        /* About */
        .about-block { margin-bottom: 24px; }
        .about-block p { font-size: 15px; color: #d1d5db; line-height: 1.8; margin-bottom: 16px; }
        .about-block .looking-for {
            background: rgba(125,211,252,0.08); border: 1px solid rgba(125,211,252,0.2);
            border-radius: 8px; padding: 24px; margin-top: 24px;
        }
        .about-block .looking-for h3 { font-size: 16px; font-weight: 600; color: #7dd3fc; margin-bottom: 8px; }
        .about-block .looking-for p { font-size: 14px; color: #d1d5db; margin-bottom: 0; }

        /* Timeline */
        .timeline-container { position: relative; padding-left: 32px; }
        .timeline-container::before {
            content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
            width: 2px; background: rgba(125,211,252,0.3);
        }
        .timeline-item { position: relative; margin-bottom: 32px; }
        .timeline-item::before {
            content: ''; position: absolute; left: -28px; top: 6px;
            width: 12px; height: 12px; border-radius: 50%;
            background: #7dd3fc; border: 2px solid #0f1419;
        }
        .timeline-year { font-size: 13px; font-weight: 600; color: #7dd3fc; margin-bottom: 4px; }
        .timeline-label { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .timeline-desc { font-size: 14px; color: #9ca3af; line-height: 1.6; }

        /* Beliefs */
        .beliefs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .belief-item {
            background: rgba(125,211,252,0.06); border-left: 3px solid #7dd3fc;
            padding: 20px 24px; border-radius: 0 8px 8px 0; transition: all 0.3s ease;
        }
        .belief-item:hover { background: rgba(125,211,252,0.1); }
        .belief-item .belief-text { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; }
        .belief-item .belief-sub { font-size: 13px; color: #9ca3af; line-height: 1.6; }

        /* Cards */
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 28px; transition: all 0.3s ease; backdrop-filter: blur(4px);
        }
        .card:hover { border-color: rgba(125,211,252,0.4); background: rgba(125,211,252,0.05); transform: translateY(-4px); }
        .card .card-year { font-size: 12px; color: #7dd3fc; font-weight: 500; margin-bottom: 8px; }
        .card h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .card .card-oneliner { font-size: 14px; color: #7dd3fc; margin-bottom: 12px; font-weight: 500; }
        .card p { font-size: 14px; color: #d1d5db; margin-bottom: 8px; line-height: 1.6; }
        .card .card-insight { font-size: 13px; color: #9ca3af; font-style: italic; margin-top: 12px; line-height: 1.6; }
        .card-links { margin-top: 12px; }
        .card-links a { font-size: 13px; margin-right: 16px; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .tag {
            display: inline-block; background: rgba(125,211,252,0.15); color: #7dd3fc;
            padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 500;
        }
        .card .card-results { font-size: 13px; color: #7dd3fc; font-weight: 500; margin-top: 8px; }

        /* Open Source */
        .oss-list { display: flex; flex-direction: column; gap: 16px; }
        .oss-item {
            border-left: 3px solid rgba(125,211,252,0.3); padding-left: 20px;
            padding-top: 4px; padding-bottom: 4px;
        }
        .oss-item h3 { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .oss-item p { font-size: 14px; color: #9ca3af; }

        /* Background */
        .background-section {
            background: rgba(125,211,252,0.08); border: 1px solid rgba(125,211,252,0.2);
            border-radius: 8px; padding: 36px; margin-bottom: 40px;
        }
        .background-section p { font-size: 15px; line-height: 1.8; color: #d1d5db; }
        .background-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 24px; }
        .stat { text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #7dd3fc; }
        .stat-label { font-size: 13px; color: #9ca3af; margin-top: 4px; }
        .research-links { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 24px; }
        .research-links a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1px solid rgba(125,211,252,0.3);
            border-radius: 6px; font-size: 14px; transition: all 0.3s ease;
        }
        .research-links a:hover { border-color: #7dd3fc; background: rgba(125,211,252,0.1); }

        /* Frameworks */
        .frameworks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
        .framework-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 24px;
        }
        .framework-item h4 { font-size: 15px; font-weight: 600; color: #7dd3fc; margin-bottom: 8px; }
        .framework-item p { font-size: 13px; color: #d1d5db; line-height: 1.6; }

        /* Writing */
        .writing-list { display: flex; flex-direction: column; gap: 20px; }
        .writing-item {
            border-left: 3px solid rgba(125,211,252,0.3); padding-left: 20px;
            padding-top: 4px; padding-bottom: 4px; transition: border-color 0.3s ease;
        }
        .writing-item:hover { border-left-color: #7dd3fc; }
        .writing-item h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #fff; }
        .writing-item .writing-meta { font-size: 12px; color: #7dd3fc; margin-bottom: 4px; }
        .writing-item p { font-size: 14px; color: #9ca3af; }

        /* Now */
        .now-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .now-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 24px; transition: all 0.3s ease;
        }
        .now-card:hover { border-color: rgba(125,211,252,0.4); }
        .now-card h3 { font-size: 15px; font-weight: 600; color: #7dd3fc; margin-bottom: 8px; }
        .now-card p { font-size: 14px; color: #d1d5db; line-height: 1.7; }

        /* Reading */
        .reading-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .reading-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 28px; transition: all 0.3s ease;
        }
        .reading-card:hover { border-color: rgba(125,211,252,0.4); background: rgba(125,211,252,0.05); }
        .reading-card h3 { font-size: 16px; font-weight: 600; color: #7dd3fc; margin-bottom: 12px; }
        .reading-card ul { list-style: none; padding: 0; }
        .reading-card li {
            font-size: 14px; color: #d1d5db; padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05); line-height: 1.6;
        }
        .reading-card li:last-child { border-bottom: none; }
        .reading-card li strong { color: #fff; }

        /* Tech */
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .tech-category {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 24px; backdrop-filter: blur(4px);
        }
        .tech-category h3 { font-size: 16px; font-weight: 600; color: #7dd3fc; margin-bottom: 12px; }
        .tech-category p { font-size: 14px; color: #d1d5db; line-height: 1.8; }

        /* Footer */
        footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 60px 0 40px; text-align: center; }
        .footer-text { font-size: 14px; color: #9ca3af; margin-bottom: 16px; }
        .footer-links { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .footer-links a { font-size: 14px; }

        /* Responsive */
        @media (max-width: 768px) {
            nav { display: none; }
            .header-content { flex-direction: column; gap: 16px; }
            .hero { padding: 60px 0 40px; }
            .hero-links { gap: 10px; }
            .hero-links a { font-size: 12px; padding: 6px 10px; }
            h2 { font-size: 24px; margin-bottom: 32px; }
            .cards, .beliefs-grid, .tech-grid, .now-grid, .reading-grid, .frameworks-grid { grid-template-columns: 1fr; }
            .background-stats { grid-template-columns: repeat(2, 1fr); }
            .background-section { padding: 24px; }
            footer { padding: 40px 0 30px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo" id="site-name"></div>
                <nav id="nav-links"></nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero" id="hero"></section>
        <section id="about"></section>
        <section id="timeline-section"></section>
        <section id="believe"></section>
        <section id="build"></section>
        <section id="background"></section>
        <section id="write"></section>
        <section id="now"></section>
        <section id="read"></section>
        <section id="tech"></section>
    </main>

    <footer>
        <div class="container" id="footer-content"></div>
    </footer>

    <script>
    fetch('data/portfolio.json')
        .then(r => r.json())
        .then(data => render(data))
        .catch(err => {
            document.querySelector('main').innerHTML = '<p style="text-align:center;padding:80px 20px;color:#9ca3af;">Failed to load portfolio data.</p>';
        });

    function esc(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    function render(d) {
        // Site name
        document.getElementById('site-name').textContent = d.site.name;
        document.title = d.site.name;

        // Nav
        const navSections = [
            { id: 'about', label: 'About' },
            { id: 'timeline-section', label: 'Timeline' },
            { id: 'believe', label: 'Believe' },
            { id: 'build', label: 'Build' },
            { id: 'write', label: 'Write' },
            { id: 'now', label: 'Now' },
            { id: 'read', label: 'Read' },
            { id: 'tech', label: 'Tech' }
        ];
        document.getElementById('nav-links').innerHTML = navSections
            .map(s => `<a href="#${esc(s.id)}">${esc(s.label)}</a>`).join('');

        // Hero
        document.getElementById('hero').innerHTML = `
            <h1>${esc(d.person.full_name)}</h1>
            <p class="tagline">${esc(d.person.headline)}</p>
            <p class="location">${esc(d.person.origin)} ${esc(d.person.current_location)}.</p>
            <div class="hero-links">
                ${d.profiles.map(p => `<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`).join('')}
            </div>
        `;

        // About
        document.getElementById('about').innerHTML = `
            <h2>About</h2>
            <div class="about-block">
                <p>${esc(d.about.thesis)}</p>
                <p>${esc(d.about.arc)}</p>
                <div class="looking-for">
                    <h3>What I'm Looking For</h3>
                    <p>${esc(d.about.looking_for)}</p>
                </div>
            </div>
        `;

        // Timeline
        document.getElementById('timeline-section').innerHTML = `
            <h2>Timeline</h2>
            <div class="timeline-container">
                ${d.timeline.map(t => `
                    <div class="timeline-item">
                        <div class="timeline-year">${esc(String(t.year))}</div>
                        <div class="timeline-label">${esc(t.label)}</div>
                        <div class="timeline-desc">${esc(t.description)}</div>
                    </div>
                `).join('')}
            </div>
        `;

        // Beliefs
        document.getElementById('believe').innerHTML = `
            <h2>What I Believe</h2>
            <div class="beliefs-grid">
                ${d.beliefs.map(b => `
                    <div class="belief-item">
                        <div class="belief-text">${esc(b.statement)}</div>
                        <div class="belief-sub">${esc(b.detail)}</div>
                    </div>
                `).join('')}
            </div>
        `;

        // Projects
        const projectCards = d.projects.map(p => {
            const links = [];
            if (p.repo_url) links.push(`<a href="${esc(p.repo_url)}" target="_blank">Repo</a>`);
            if (p.demo_url) links.push(`<a href="${esc(p.demo_url)}" target="_blank">Demo</a>`);
            if (p.writeup_url) links.push(`<a href="${esc(p.writeup_url)}" target="_blank">Write-up</a>`);
            if (p.model_url) links.push(`<a href="${esc(p.model_url)}" target="_blank">Model</a>`);
            if (p.dataset_url) links.push(`<a href="${esc(p.dataset_url)}" target="_blank">Dataset</a>`);

            return `
                <div class="card">
                    ${p.year_started ? `<div class="card-year">${esc(p.year_started)}${p.year_ended ? ' – ' + esc(p.year_ended) : ''}</div>` : ''}
                    <h3>${esc(p.name)}</h3>
                    ${p.one_liner ? `<div class="card-oneliner">${esc(p.one_liner)}</div>` : ''}
                    ${p.what_it_does ? `<p>${esc(p.what_it_does)}</p>` : ''}
                    ${p.results ? `<div class="card-results">${esc(p.results)}</div>` : ''}
                    ${p.what_i_learned ? `<div class="card-insight">${esc(p.what_i_learned)}</div>` : ''}
                    ${links.length ? `<div class="card-links">${links.join('')}</div>` : ''}
                    ${p.tech_stack && p.tech_stack.length ? `<div class="card-tags">${p.tech_stack.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
                </div>
            `;
        }).join('');

        const ossHtml = d.open_source.map(o => `
            <div class="oss-item">
                <h3>${esc(o.project)}${o.year ? ' (' + esc(String(o.year)) + ')' : ''}</h3>
                <p>${esc(o.contribution)}${o.significance ? ' — ' + esc(o.significance) : ''}</p>
            </div>
        `).join('');

        document.getElementById('build').innerHTML = `
            <h2>What I Build</h2>
            <div class="cards">${projectCards}</div>
            <div style="margin-top:48px;">
                <h3 style="font-size:18px;font-weight:600;color:#fff;margin-bottom:16px;">Open Source</h3>
                <div class="oss-list">${ossHtml}</div>
            </div>
        `;

        // Background + Research
        const frameworksHtml = d.research.frameworks_created.map(f => `
            <div class="framework-item">
                <h4>${esc(f.name)}</h4>
                <p>${esc(f.description)}</p>
            </div>
        `).join('');

        document.getElementById('background').innerHTML = `
            <h2>Before AI: 18 Years in Platform & Quality</h2>
            <div class="background-section">
                <p>${esc(d.career_background.summary)}</p>
                <p style="margin-top:16px;">${esc(d.career_background.key_insight)}</p>
                <div class="background-stats">
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.patents)}</div><div class="stat-label">US Patents</div></div>
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.citations)}</div><div class="stat-label">Citations</div></div>
                    <div class="stat"><div class="stat-number">${esc(String(d.research.stats.years_in_idp))}</div><div class="stat-label">Years IDP</div></div>
                </div>
            </div>
            <h3 style="font-size:18px;font-weight:600;color:#fff;margin-bottom:16px;">Original Frameworks</h3>
            <div class="frameworks-grid">${frameworksHtml}</div>
            <div class="research-links">
                ${d.profiles.filter(p => p.platform === 'Google Scholar' || p.platform === 'ResearchGate')
                    .map(p => `<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`).join('')}
            </div>
        `;

        // Writing
        document.getElementById('write').innerHTML = `
            <h2>What I Write</h2>
            <div class="writing-list">
                ${d.writing.map(w => {
                    const meta = [];
                    if (w.type === 'series' && w.parts) meta.push(w.parts + '-part series');
                    if (w.platform) meta.push(w.platform);
                    const title = w.url
                        ? `<a href="${esc(w.url)}" target="_blank">${esc(w.title)}</a>`
                        : esc(w.title);
                    return `
                        <div class="writing-item">
                            <h3>${title}</h3>
                            ${meta.length ? `<div class="writing-meta">${esc(meta.join(' · '))}</div>` : ''}
                            <p>${esc(w.summary)}</p>
                        </div>
                    `;
                }).join('')}
            </div>
        `;

        // Now
        document.getElementById('now').innerHTML = `
            <h2>Now</h2>
            <p class="section-sub">Where my head is at right now.</p>
            <div class="now-grid">
                ${d.now.items.map(n => `
                    <div class="now-card">
                        <h3>${esc(n.topic)}</h3>
                        <p>${esc(n.detail)}</p>
                    </div>
                `).join('')}
            </div>
        `;

        // Reading & Interests
        const ri = d.reading_and_interests;
        document.getElementById('read').innerHTML = `
            <h2>What I Read & What Moves Me</h2>
            <div class="reading-grid">
                <div class="reading-card">
                    <h3>Thinkers Who Shaped Me</h3>
                    <ul>${ri.thinkers.map(t => `<li><strong>${esc(t.name)}</strong> &mdash; ${esc(t.influence)}</li>`).join('')}</ul>
                </div>
                <div class="reading-card">
                    <h3>What I Follow</h3>
                    <ul>${ri.topics_i_follow.map(t => `<li><strong>${esc(t.area)}</strong> &mdash; ${esc(t.specifics)}</li>`).join('')}</ul>
                </div>
                <div class="reading-card">
                    <h3>Interests Beyond Code</h3>
                    <ul>${ri.interests.map(i => `<li><strong>${esc(i.name)}</strong> &mdash; ${esc(i.depth)}</li>`).join('')}</ul>
                </div>
            </div>
        `;

        // Tech Stack
        document.getElementById('tech').innerHTML = `
            <h2>Tech Stack</h2>
            <div class="tech-grid">
                ${d.tech_stack.map(t => `
                    <div class="tech-category">
                        <h3>${esc(t.category)}</h3>
                        <p>${t.tools.map(tool => esc(tool)).join(', ')}</p>
                    </div>
                `).join('')}
            </div>
        `;

        // Footer
        const footerProfiles = d.profiles.map(p =>
            `<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`
        ).join('');
        document.getElementById('footer-content').innerHTML = `
            <p class="footer-text">${esc(d.footer.tagline)}</p>
            <div class="footer-links">${footerProfiles}</div>
        `;
    }
    </script>
</body>
</html>
