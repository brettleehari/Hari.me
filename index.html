    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1419; color: #e0e6ed; line-height: 1.6;
        }
        a { color: #7dd3fc; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #38bdf8; }
        .wide { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .narrow { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        /* Header */
        header {
            padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky; top: 0; background: rgba(15,20,25,0.97);
            backdrop-filter: blur(12px); z-index: 100;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 18px; font-weight: 700; color: #fff; cursor: pointer; }
        nav { display: flex; gap: 6px; flex-wrap: wrap; }
        nav a { font-size: 12px; color: #6b7280; padding: 3px 8px; border-radius: 4px; transition: all 0.2s; }
        nav a:hover { color: #e0e6ed; background: rgba(255,255,255,0.06); }

        /* Compact Hero with About sidebar */
        .hero-row {
            display: grid; grid-template-columns: 1fr 260px; gap: 32px;
            padding: 32px 0 24px; align-items: start;
        }
        .hero-main h1 { font-size: clamp(28px,4vw,40px); font-weight: 700; letter-spacing: -0.8px; color: #fff; margin-bottom: 8px; }
        .hero-main .hero-headline { font-size: clamp(17px,2.2vw,22px); font-weight: 600; line-height: 1.4; color: #7dd3fc; letter-spacing: -0.3px; margin-bottom: 10px; }
        .hero-main .tagline { font-size: 14px; color: #9ca3af; line-height: 1.7; margin-bottom: 12px; }
        .hero-main .location { font-size: 12px; color: #9ca3af; margin-bottom: 16px; }
        .hero-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .hero-links a {
            padding: 4px 10px; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 5px; font-size: 11px; color: #6b7280; transition: all 0.2s;
        }
        .hero-links a:hover { border-color: rgba(125,211,252,0.3); color: #7dd3fc; }

        .about-sidebar {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 20px; font-size: 13px; color: #9ca3af; line-height: 1.7;
        }
        .about-sidebar h3 { font-size: 12px; font-weight: 700; color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .about-sidebar p { margin-bottom: 10px; }
        .about-sidebar p:last-child { margin-bottom: 0; }
        .about-stats { display: flex; gap: 16px; }
        .about-stat { text-align: center; flex: 1; }
        .about-stat .num { font-size: 18px; font-weight: 700; color: #7dd3fc; }
        .about-stat .lbl { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Featured strip */
        .feat-label { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .feat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .feat-card {
            background: rgba(125,211,252,0.04); border: 1px solid rgba(125,211,252,0.12);
            border-radius: 8px; padding: 18px;
        }
        .feat-card .feat-year { font-size: 10px; font-weight: 700; color: #7dd3fc; margin-bottom: 4px; }
        .feat-card h4 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .feat-card p { font-size: 12px; color: #9ca3af; line-height: 1.5; margin-bottom: 6px; }
        .feat-card .feat-results { font-size: 11px; font-weight: 600; color: #7dd3fc; font-family: 'SF Mono', 'Menlo', monospace; margin-bottom: 6px; }
        .feat-card .feat-link { font-size: 11px; font-weight: 600; color: #7dd3fc; }

        /* Section basics */
        section { margin-bottom: 64px; }
        .section-header { margin-bottom: 24px; }
        .section-header h2 {
            font-size: 20px; font-weight: 700; color: #fff;
            display: flex; align-items: center; gap: 10px;
        }
        .section-header h2 .section-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
        .section-sub { font-size: 13px; color: #9ca3af; margin-top: 6px; }

        /* ===== 4-LANE JOURNEY ===== */
        .journey-intro { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
        .lane-tabs { display: flex; gap: 0; margin-bottom: 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .lane-tab {
            flex: 1; padding: 12px 8px; text-align: center; cursor: pointer;
            font-size: 13px; font-weight: 600; color: #9ca3af;
            border-bottom: 2px solid transparent; transition: all 0.2s;
            background: none; border-top: none; border-left: none; border-right: none;
            font-family: inherit;
        }
        .lane-tab:hover { color: #d1d5db; background: rgba(255,255,255,0.02); }
        .lane-tab.active { color: var(--lane-color, #7dd3fc); border-bottom-color: var(--lane-color, #7dd3fc); }
        .lane-tab .tab-count {
            display: inline-block; font-size: 10px; background: rgba(255,255,255,0.06);
            color: #6b7280; padding: 1px 6px; border-radius: 8px; margin-left: 4px;
        }
        .lane-tab.active .tab-count { background: var(--lane-bg, rgba(125,211,252,0.1)); color: var(--lane-color, #7dd3fc); }

        .lane-panel { display: none; padding: 20px 0; }
        .lane-panel.active { display: block; }

        .lane-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

        .lc {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 18px; cursor: pointer; transition: all 0.2s;
            border-left: 3px solid var(--lane-color, #7dd3fc);
        }
        .lc:hover { border-color: rgba(255,255,255,0.12); border-left-color: var(--lane-color, #7dd3fc); background: rgba(255,255,255,0.05); }
        .lc .lc-year { font-size: 10px; font-weight: 700; color: var(--lane-color, #7dd3fc); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .lc h4 { font-size: 14px; font-weight: 600; color: #e0e6ed; margin-bottom: 4px; }
        .lc .lc-oneliner { font-size: 13px; color: #9ca3af; line-height: 1.5; }
        .lc .lc-primary-link {
            display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600;
            color: var(--lane-color, #7dd3fc); transition: opacity 0.2s;
        }
        .lc .lc-primary-link:hover { opacity: 0.8; }
        .lc .lc-hint { font-size: 10px; color: #4b5563; margin-top: 4px; }
        .lc.open .lc-hint { display: none; }
        .lc .lc-detail {
            max-height: 0; overflow: hidden; transition: max-height 0.35s ease;
        }
        .lc.open .lc-detail { max-height: 600px; }
        .lc .lc-detail p { font-size: 12px; color: #d1d5db; line-height: 1.6; margin-top: 10px; }
        .lc .lc-detail .lc-insight { font-size: 11px; color: #9ca3af; font-style: italic; margin-top: 6px; }
        .lc .lc-results { font-size: 11px; color: var(--lane-color, #7dd3fc); font-weight: 500; margin-top: 6px; font-family: 'SF Mono', 'Menlo', monospace; }
        .lc .lc-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .lc .lc-links a {
            font-size: 10px; padding: 2px 8px; border-radius: 3px;
            border: 1px solid rgba(125,211,252,0.15); color: #7dd3fc; transition: all 0.2s;
        }
        .lc .lc-links a:hover { background: rgba(125,211,252,0.1); border-color: rgba(125,211,252,0.3); }
        .lc .lc-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .lc .lc-tags span {
            font-size: 10px; background: rgba(255,255,255,0.05); color: #6b7280;
            padding: 1px 6px; border-radius: 3px;
        }

        /* Lane colors */
        [data-lane="oss"] { --lane-color: #34d399; --lane-bg: rgba(52,211,153,0.1); }
        [data-lane="live"] { --lane-color: #60a5fa; --lane-bg: rgba(96,165,250,0.1); }
        [data-lane="entrepreneur"] { --lane-color: #f87171; --lane-bg: rgba(248,113,113,0.1); }
        [data-lane="research"] { --lane-color: #c084fc; --lane-bg: rgba(192,132,252,0.1); }
        [data-lane="public"] { --lane-color: #fbbf24; --lane-bg: rgba(251,191,36,0.1); }

        /* Remaining sections reuse prior styles */
        .beliefs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .belief-item { background: rgba(255,255,255,0.03); border-left: 2px solid rgba(125,211,252,0.3); padding: 14px 18px; border-radius: 0 6px 6px 0; transition: all 0.2s; }
        .belief-item:hover { background: rgba(125,211,252,0.05); border-left-color: #7dd3fc; }
        .belief-text { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 3px; }
        .belief-sub { font-size: 11px; color: #9ca3af; line-height: 1.5; }

        .bg-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        .bg-card p { font-size: 13px; line-height: 1.8; color: #d1d5db; }
        .stats-row { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat-number { font-size: 22px; font-weight: 700; color: #7dd3fc; }
        .stat-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }

        .fw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
        .fw-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 14px; }
        .fw-item h4 { font-size: 12px; font-weight: 600; color: #7dd3fc; margin-bottom: 3px; }
        .fw-item p { font-size: 11px; color: #9ca3af; line-height: 1.5; }

        .book-card { display: flex; gap: 20px; align-items: center; background: rgba(251,191,36,0.04); border: 1px solid rgba(251,191,36,0.15); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .book-icon { font-size: 36px; opacity: 0.7; }
        .book-info h3 { font-size: 15px; font-weight: 600; color: #fbbf24; margin-bottom: 3px; }
        .book-info .book-meta { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
        .book-info p { font-size: 12px; color: #d1d5db; line-height: 1.6; }

        .small-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
        .small-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 14px; }
        .small-card h4 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .small-card .meta { font-size: 10px; color: #7dd3fc; margin-bottom: 3px; }
        .small-card p { font-size: 11px; color: #9ca3af; line-height: 1.5; }
        .small-card:hover { border-color: rgba(255,255,255,0.1); }

        .writing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
        .now-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
        .reading-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
        .reading-card ul { list-style: none; padding: 0; }
        .reading-card li { font-size: 12px; color: #d1d5db; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.5; }
        .reading-card li:last-child { border-bottom: none; }
        .reading-card li strong { color: #fff; }
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .edu-grid { display: flex; gap: 12px; flex-wrap: wrap; }
        .edu-item { flex: 1; min-width: 220px; }

        footer { border-top: 1px solid rgba(255,255,255,0.06); padding: 40px 0 28px; text-align: center; }
        .footer-text { font-size: 12px; color: #6b7280; margin-bottom: 10px; }
        .footer-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .footer-links a { font-size: 11px; color: #6b7280; }
        .footer-links a:hover { color: #7dd3fc; }

        @media (max-width: 860px) {
            .hero-row { grid-template-columns: 1fr; gap: 16px; }
            .about-sidebar { margin-top: 0; }
            .feat-grid { grid-template-columns: 1fr; }
            .lane-tabs { overflow-x: auto; flex-wrap: nowrap; }
            .lane-tab { white-space: nowrap; flex: none; padding: 10px 14px; }
            .lane-cards { grid-template-columns: 1fr; }
            nav { gap: 4px; }
            nav a { font-size: 11px; padding: 2px 6px; }
            .book-card { flex-direction: column; text-align: center; }
        }
        /* Skip link */
        .skip-link { position: absolute; left: -9999px; }
        .skip-link:focus { left: 12px; top: 12px; background: #fff; color: #000; padding: 6px 10px; border-radius: 4px; z-index: 200; font-size: 13px; }

        /* Print */
        @media print {
            body { background: #fff; color: #111; }
            header, footer, nav, .lane-tabs, .skip-link, .hero-links, .lc-hint, .feat-label { display: none; }
            .hero-row { grid-template-columns: 1fr; }
            .about-sidebar { border: 1px solid #ccc; }
            .lane-panel { display: block !important; margin-bottom: 24px; }
            .lc, .feat-card, .small-card, .belief-item, .fw-item, .bg-card { border: 1px solid #ddd; break-inside: avoid; }
            .lc .lc-detail { max-height: none !important; }
            a { color: #111; text-decoration: underline; }
            .stat-number { color: #111; }
        }
    </style>
</head>
<body>
    <a href="#journey" class="skip-link">Skip to content</a>
    <header><div class="header-content">
        <div class="logo" id="site-name"></div>
        <nav id="nav-links"></nav>
    </div></header>

    <div class="wide">
        <section class="hero-row" id="hero-row"></section>
    </div>

    <div class="wide">
        <section id="journey"></section>
    </div>

    <div class="narrow">
        <section id="believe"></section>
        <section id="background"></section>
        <section id="book-speak"></section>
        <section id="speaking"></section>
        <section id="write"></section>
        <section id="now"></section>
        <section id="read"></section>
        <section id="tech"></section>
        <section id="education"></section>
    </div>

    <footer><div class="narrow" id="footer-content"></div></footer>

    <script>
    fetch('data/portfolio.json').then(r=>r.json()).then(render).catch(()=>{
        document.querySelector('.wide').innerHTML='<p style="text-align:center;padding:80px 20px;color:#6b7280;">Failed to load portfolio data.</p>';
    });

    function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
    function sh(t,sub){return `<div class="section-header"><h2>${esc(t)} <span class="section-line"></span></h2>${sub?`<p class="section-sub">${esc(sub)}</p>`:''}</div>`;}

    function render(d) {
        document.getElementById('site-name').textContent = d.site.name;
        document.title = `${d.person.full_name} — ${d.person.headline.split('.')[0]}`;

        const nav=[['journey','Journey'],['believe','Beliefs'],['background','Research'],['book-speak','Book'],['speaking','Speaking'],['write','Write'],['now','Now'],['tech','Stack']];
        document.getElementById('nav-links').innerHTML=nav.map(([id,l])=>`<a href="#${id}">${l}</a>`).join('');

        // Hero + About sidebar
        document.getElementById('hero-row').innerHTML = `
            <div class="hero-main">
                <h1>${esc(d.person.full_name)}</h1>
                ${d.person.hero_headline ? `<p class="hero-headline">${esc(d.person.hero_headline)}</p>` : ''}
                <p class="tagline">${esc(d.person.headline)}</p>
                <p class="location">${esc(d.person.current_location)}</p>
                <div class="hero-links">
                    ${d.profiles.map(p=>`<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`).join('')}
                </div>
            </div>
            <div class="about-sidebar">
                <div class="about-stats">
                    <a href="https://scholar.google.com/citations?hl=en&user=0ifJK1sAAAAJ" target="_blank" class="about-stat" style="text-decoration:none;color:inherit;"><div class="num">${esc(d.research.stats.patents)}</div><div class="lbl">Patents</div></a>
                    <div class="about-stat"><div class="num">${esc(d.research.stats.papers)}</div><div class="lbl">Papers</div></div>
                    <a href="https://scholar.google.com/citations?hl=en&user=0ifJK1sAAAAJ" target="_blank" class="about-stat" style="text-decoration:none;color:inherit;"><div class="num">${esc(d.research.stats.citations)}</div><div class="lbl">Citations</div></a>
                    <div class="about-stat"><div class="num">${esc(String(d.person.years_in_tech))}</div><div class="lbl">Years</div></div>
                </div>
            </div>`;

        // C2: Featured strip
        const featured = d.projects.filter(p=>p.pinned).sort((a,b)=>a.featured_order-b.featured_order).slice(0,3);
        const featuredHtml = featured.map(p => {
            const link = p.demo_url || p.model_url || p.repo_url || '';
            const linkLabel = p.demo_url ? 'Live Application' : p.model_url ? 'Model' : 'GitHub';
            return `<div class="feat-card">
                <div class="feat-year">${esc(p.year_started)}</div>
                <h4>${esc(p.name)}</h4>
                <p>${esc(p.one_liner)}</p>
                ${p.results ? `<div class="feat-results">${esc(p.results.split('.')[0])}</div>` : ''}
                ${link ? `<a href="${esc(link)}" target="_blank" class="feat-link">${esc(linkLabel)} &rarr;</a>` : ''}
            </div>`;
        }).join('');

        const ossCard = `<div class="feat-card" style="border-color:rgba(52,211,153,0.2);background:rgba(52,211,153,0.04);">
            <div class="feat-year" style="color:#34d399;">Since 2016</div>
            <h4>Open Source Contributor</h4>
            <p>LlamaIndex, Warrior Framework. Arctic Code Vault.</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;">
                <a href="https://github.com/run-llama/llama_index/pull/15311" target="_blank"><img src="https://img.shields.io/badge/PRs_Merged-LlamaIndex%2C_Warrior-34d399?style=flat&logo=github&labelColor=0f1419" alt="PRs" style="height:20px;"></a>
                <img src="https://img.shields.io/badge/Arctic_Code_Vault-Contributor-7dd3fc?style=flat&logo=github&labelColor=0f1419" alt="Arctic" style="height:20px;">
            </div>
            <a href="https://github.com/brettleehari" target="_blank" class="feat-link" style="color:#34d399;">GitHub Profile &rarr;</a>
        </div>`;

        document.getElementById('journey').insertAdjacentHTML('beforebegin',
            `<div class="featured-strip" style="margin-bottom:32px;">
                <div class="feat-label">Featured Work</div>
                <div class="feat-grid">${ossCard}${featuredHtml}</div>
            </div>`);

        // ===== 5-LANE JOURNEY =====
        // Categorize projects + timeline into 4 lanes
        const ossItems = d.open_source.map(o => ({
            year: o.year || '', title: o.project, oneliner: o.contribution,
            desc: o.significance || '', links: o.url ? [{label:'View PR / Repo', url:o.url}] : [], tags: []
        }));

        const liveItems = d.projects.filter(p => p.demo_url || p.model_url || p.dataset_url).map(p => ({
            year: p.year_started, title: p.name, oneliner: p.one_liner,
            desc: p.what_it_does, insight: p.what_i_learned, results: p.results,
            links: [
                p.demo_url ? {label:'Live Application',url:p.demo_url} : null,
                p.repo_url ? {label:'GitHub',url:p.repo_url} : null,
                p.writeup_url ? {label:'Write-up',url:p.writeup_url} : null,
                p.model_url ? {label:'Model',url:p.model_url} : null,
                p.dataset_url ? {label:'Dataset',url:p.dataset_url} : null,
            ].filter(Boolean),
            tags: p.tech_stack || []
        }));

        const entrepreneurItems = [
            {
                year: '2015', title: 'Uber Fleet Management Venture, Chennai',
                oneliner: 'Developed an overlay application for fleet management, coordination, driver scheduling, and earnings optimization.',
                desc: 'Actively used the application and shared with others managing a fleet with GPS for coordination, fuel, maintenance, depreciation providing a clear P&L per car per driver based on changing Uber incentive systems.',
                links: [], tags: []
            },
            {
                year: '2019', title: 'Smart-Review on GitHub Marketplace',
                oneliner: 'Developed a suite of DevTools to be launched in GitHub Marketplace.',
                desc: 'Presented multiple apps in local conferences and international ones such as InfluxDays. Identified the code review bottleneck, built a Probot app with a PyDriller scoring engine, published it on the GitHub Marketplace, wrote about it on Medium.',
                links: [
                    {label:'Original repo (2019)', url:'https://github.com/pitchdarkdata/MVP1'},
                    {label:'Pitchdarkdata (business account)', url:'https://github.com/pitchdarkdata'},
                    {label:'2026 rebuild', url:'https://github.com/brettleehari/reviewbuddy'},
                    {label:'Live Application', url:'https://brettleehari.github.io/reviewbuddy/'},
                    {label:'Medium article', url:'https://medium.com/towardsdev/are-you-adding-the-best-code-reviewer-for-each-pull-request-59706275acc7'}
                ], tags: ['Probot','PyDriller','React','FastAPI']
            }
        ];

        const publicItems = [
            ...(d.writing.filter(w => w.url).map(w => ({
                year: w.date || '', title: w.title,
                oneliner: w.summary,
                desc: w.type === 'series' ? w.parts + '-part series' + (w.platform ? ' on ' + w.platform : '') : (w.platform || ''),
                links: w.url ? [{label:'Read', url:w.url}] :
                    w.platform && w.platform.includes('Substack') ? [{label:'Substack', url:'https://substack.com/@brettleehari'}] :
                    w.platform && w.platform.includes('Medium') ? [{label:'Medium', url:'https://medium.com/@brettleehari'}] :
                    w.platform && w.platform.includes('LinkedIn') ? [{label:'LinkedIn', url:'https://linkedin.com/in/haripm4ai'}] :
                    [{label:'Substack', url:'https://substack.com/@brettleehari'}],
                tags: []
            }))),
            ...(d.book ? [{
                year: d.book.year, title: d.book.title,
                oneliner: d.book.edition + '. ' + d.book.description,
                desc: '', links: [{label:'Linktree', url:'https://linktr.ee/brettleehari'}], tags: []
            }] : []),
            ...(d.speaking ? d.speaking.map(s => ({
                year: s.date || '', title: s.event,
                oneliner: s.topic, desc: '',
                links: s.event.includes('dallas-ai') ? [{label:'dallas-ai.org', url:'https://dallas-ai.org'}] :
                    [{label:'LinkedIn', url:'https://linkedin.com/in/haripm4ai'}],
                tags: []
            })) : [])
        ];

        // Add projects without live demos to public track (they have repos)
        d.projects.filter(p => !p.demo_url && !p.model_url && !p.dataset_url && p.repo_url).forEach(p => {
            publicItems.push({
                year: p.year_started, title: p.name, oneliner: p.one_liner,
                desc: p.what_it_does, insight: p.what_i_learned, results: p.results,
                links: [
                    p.repo_url ? {label:'GitHub',url:p.repo_url} : null,
                    p.model_url ? {label:'Model',url:p.model_url} : null,
                ].filter(Boolean),
                tags: p.tech_stack || []
            });
        });

        function laneCard(item) {
            const primary = item.links && item.links.length ? item.links[0] : null;
            const restLinks = item.links && item.links.length > 1 ? item.links.slice(1) : [];
            const allLinksHtml = item.links && item.links.length
                ? `<div class="lc-links">${item.links.map(l=>`<a href="${esc(l.url)}" target="_blank" onclick="event.stopPropagation()">${esc(l.label)}</a>`).join('')}</div>` : '';
            const tagsHtml = item.tags && item.tags.length
                ? `<div class="lc-tags">${item.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>` : '';
            return `
                <div class="lc" onclick="this.classList.toggle('open')">
                    ${item.year ? `<div class="lc-year">${esc(String(item.year))}</div>` : ''}
                    <h4>${esc(item.title)}</h4>
                    <div class="lc-oneliner">${esc(item.oneliner)}</div>
                    ${item.results ? `<div class="lc-results">${esc(item.results)}</div>` : ''}
                    ${primary ? `<a class="lc-primary-link" href="${esc(primary.url)}" target="_blank" onclick="event.stopPropagation()">${esc(primary.label)} &rarr;</a>` : ''}
                    <div class="lc-hint">${item.desc || restLinks.length ? 'click for details' : ''}</div>
                    <div class="lc-detail">
                        ${item.desc ? `<p>${esc(item.desc)}</p>` : ''}
                        ${item.insight ? `<div class="lc-insight">${esc(item.insight)}</div>` : ''}
                        ${restLinks.length ? `<div class="lc-links">${restLinks.map(l=>`<a href="${esc(l.url)}" target="_blank" onclick="event.stopPropagation()">${esc(l.label)}</a>`).join('')}</div>` : ''}
                        ${tagsHtml}
                    </div>
                </div>`;
        }

        const researchItems = [
            ...d.research.patents.filter(p=>p.title).map(p=>({
                year: p.year_granted, title: p.title,
                oneliner: p.one_line_summary,
                desc: 'US Patent. Granted ' + p.year_granted + '.',
                links: [{label:'Google Scholar', url:p.url || 'https://scholar.google.com/citations?hl=en&user=0ifJK1sAAAAJ'}],
                tags: []
            })),
            ...d.research.papers.filter(p=>p.title).map(p=>({
                year: p.year || '', title: p.title,
                oneliner: p.one_line_summary,
                desc: p.venue ? 'Published in ' + p.venue : '',
                links: p.url ? [{label:'Read paper', url:p.url}] : [{label:'Google Scholar', url:'https://scholar.google.com/citations?hl=en&user=0ifJK1sAAAAJ'}],
                tags: []
            })),
            ...d.research.frameworks_created.map(f=>({
                year: '', title: f.name,
                oneliner: f.description,
                desc: f.published_on ? 'Published on ' + f.published_on : '',
                links: f.url ? [{label:'View', url:f.url}] :
                    f.published_on === 'LinkedIn' ? [{label:'LinkedIn', url:'https://linkedin.com/in/haripm4ai'}] :
                    f.published_on === 'Substack' ? [{label:'Substack', url:'https://substack.com/@brettleehari'}] :
                    [{label:'Google Scholar', url:'https://scholar.google.com/citations?hl=en&user=0ifJK1sAAAAJ'}],
                tags: []
            }))
        ];

        const lanes = [
            { id:'oss', label:'Open Source', items: ossItems, count: ossItems.length },
            { id:'entrepreneur', label:'Entrepreneurship Attempts', items: entrepreneurItems, count: entrepreneurItems.length },
            { id:'live', label:'Live Projects', items: liveItems, count: liveItems.length },
            { id:'research', label:'Research & Patents', items: researchItems, count: researchItems.length },
            { id:'public', label:'Building in Public', items: publicItems, count: publicItems.length },
        ];

        const tabsHtml = lanes.map((l,i) =>
            `<button class="lane-tab${i===0?' active':''}" data-lane="${l.id}" data-target="lane-${l.id}">${l.label} <span class="tab-count">${l.count}</span></button>`
        ).join('');

        const panelsHtml = lanes.map((l,i) =>
            `<div class="lane-panel${i===0?' active':''}" id="lane-${l.id}" data-lane="${l.id}">
                <div class="lane-cards">${l.items.map(laneCard).join('')}</div>
            </div>`
        ).join('');

        document.getElementById('journey').innerHTML = `
            ${sh('The Journey','Every card links to a real artifact: a live project, a merged PR, a published paper, a patent filing. Fraction of my work available in public domain.')}
            <div class="lane-tabs">${tabsHtml}</div>
            ${panelsHtml}
        `;

        // Tab switching
        document.querySelectorAll('.lane-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.lane-tab').forEach(t=>t.classList.remove('active'));
                document.querySelectorAll('.lane-panel').forEach(p=>p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        // Beliefs (C4: show 3 featured, toggle for rest)
        const featBeliefs = d.beliefs.filter(b=>b.featured);
        const restBeliefs = d.beliefs.filter(b=>!b.featured);
        const beliefCard = b => `<div class="belief-item"><div class="belief-text">${esc(b.statement)}</div><div class="belief-sub">${esc(b.detail)}</div></div>`;
        document.getElementById('believe').innerHTML = `
            ${sh('What I Believe')}
            <div class="beliefs-grid">${featBeliefs.map(beliefCard).join('')}</div>
            ${restBeliefs.length ? `<div id="beliefs-rest" style="display:none;margin-top:12px;"><div class="beliefs-grid">${restBeliefs.map(beliefCard).join('')}</div></div>
            <button onclick="const el=document.getElementById('beliefs-rest');const s=el.style.display==='none';el.style.display=s?'block':'none';this.textContent=s?'Show fewer':'Show all (${d.beliefs.length})';" style="margin-top:12px;background:none;border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#7dd3fc;font-size:12px;padding:4px 12px;cursor:pointer;font-family:inherit;">Show all (${d.beliefs.length})</button>` : ''}`;

        // Research
        const fwHtml = d.research.frameworks_created.map(f=>`<div class="fw-item"><h4>${esc(f.name)}</h4><p>${esc(f.description)}</p></div>`).join('');
        const patHtml = d.research.patents.filter(p=>p.title).map(p=>`<div class="fw-item"><h4>${esc(p.title)}</h4><p>Granted ${esc(p.year_granted)}. ${esc(p.one_line_summary)}</p></div>`).join('');

        document.getElementById('background').innerHTML = `
            ${sh('Research, Patents, and Platform Work')}
            <div class="bg-card">
                <p>${esc(d.career_background.summary)}</p>
                <p style="margin-top:10px;font-style:italic;color:#9ca3af;font-size:12px;">${esc(d.career_background.key_insight)}</p>
                <div class="stats-row">
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.patents)}</div><div class="stat-label">Patents</div></div>
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.papers)}</div><div class="stat-label">Papers</div></div>
                    <div class="stat"><div class="stat-number">${esc(d.research.stats.citations)}</div><div class="stat-label">Citations</div></div>
                </div>
            </div>
            <h3 style="font-size:13px;font-weight:600;color:#fbbf24;margin-bottom:6px;">Patents</h3>
            <div class="fw-grid">${patHtml}</div>
            <h3 style="font-size:13px;font-weight:600;color:#7dd3fc;margin:20px 0 6px;">Original Frameworks</h3>
            <div class="fw-grid">${fwHtml}</div>
            <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
                ${d.profiles.filter(p=>p.platform==='Google Scholar'||p.platform==='ResearchGate').map(p=>`<a href="${esc(p.url)}" target="_blank" style="font-size:12px;padding:4px 12px;border:1px solid rgba(255,255,255,0.08);border-radius:5px;color:#6b7280;">${esc(p.platform)}</a>`).join('')}
            </div>`;

        // Book
        const bookHtml = d.book ? `<div class="book-card"><div class="book-icon">&#128214;</div><div class="book-info"><h3>${esc(d.book.title)}</h3><div class="book-meta">${esc(d.book.edition)}, ${esc(d.book.year)}</div><p>${esc(d.book.description)}</p></div></div>` : '';
        document.getElementById('book-speak').innerHTML = `${sh('Book')}${bookHtml}`;

        // Speaking & Roadshows
        const tenseChip = t => t === 'upcoming' ? '<span style="font-size:10px;background:rgba(52,211,153,0.15);color:#34d399;padding:1px 6px;border-radius:3px;margin-left:6px;">upcoming</span>' :
            t === 'recurring' ? '<span style="font-size:10px;background:rgba(251,191,36,0.15);color:#fbbf24;padding:1px 6px;border-radius:3px;margin-left:6px;">recurring</span>' :
            '<span style="font-size:10px;background:rgba(255,255,255,0.06);color:#6b7280;padding:1px 6px;border-radius:3px;margin-left:6px;">past</span>';
        const speakHtml = d.speaking ? d.speaking.map(s=>{
            const links = [
                s.url ? `<a href="${esc(s.url)}" target="_blank">Speaker page</a>` : '',
                s.announcement_url ? `<a href="${esc(s.announcement_url)}" target="_blank">Announcement</a>` : ''
            ].filter(Boolean).join(' &middot; ');
            return `<div class="small-card"><h4>${esc(s.event)}${s.tense ? tenseChip(s.tense) : ''}</h4>${s.date?`<div class="meta">${esc(s.date)}</div>`:''}<p>${esc(s.topic)}</p>${links?`<div class="meta" style="margin-top:6px;">${links}</div>`:''}</div>`;
        }).join('') : '';
        document.getElementById('speaking').innerHTML = `${sh('Speaking & Roadshows')}<div class="small-grid">${speakHtml}</div>`;

        // Writing
        document.getElementById('write').innerHTML = `
            ${sh('What I Write')}
            <div class="writing-grid">
                ${d.writing.filter(w=>w.url).map(w=>{
                    const m=[];if(w.type==='series'&&w.parts)m.push(w.parts+'-part series');if(w.platform)m.push(w.platform);if(w.date)m.push(w.date);
                    const t=w.url?`<a href="${esc(w.url)}" target="_blank">${esc(w.title)}</a>`:esc(w.title);
                    return `<div class="small-card"><h4>${t}</h4>${m.length?`<div class="meta">${esc(m.join(' / '))}</div>`:''}<p>${esc(w.summary)}</p></div>`;
                }).join('')}
            </div>`;

        // Now
        document.getElementById('now').innerHTML = `
            ${sh('Now','Where my head is at right now.')}
            <div class="now-grid">
                ${d.now.items.map(n=>`<div class="small-card"><h4 style="color:#7dd3fc;">${esc(n.topic)}</h4><p>${esc(n.detail)}</p></div>`).join('')}
            </div>`;

        // Reading
        const ri=d.reading_and_interests;
        document.getElementById('read').innerHTML = `
            ${sh('What I Read and What Moves Me')}
            <div class="reading-grid">
                <div class="small-card"><h4 style="color:#7dd3fc;">Thinkers Who Shaped Me</h4><ul class="reading-card">${ri.thinkers.map(t=>`<li><strong>${esc(t.name)}</strong> &mdash; ${esc(t.influence)}</li>`).join('')}</ul></div>
                <div class="small-card"><h4 style="color:#7dd3fc;">What I Follow</h4><ul class="reading-card">${ri.topics_i_follow.map(t=>`<li><strong>${esc(t.area)}</strong> &mdash; ${esc(t.specifics)}</li>`).join('')}</ul></div>
                <div class="small-card"><h4 style="color:#7dd3fc;">Interests Beyond Code</h4><ul class="reading-card">${ri.interests.map(i=>`<li><strong>${esc(i.name)}</strong> &mdash; ${esc(i.depth)}</li>`).join('')}</ul></div>
            </div>`;

        // Tech
        document.getElementById('tech').innerHTML = `
            ${sh('Tech Stack')}
            <div class="tech-grid">
                ${d.tech_stack.map(t=>`<div class="small-card"><h4 style="color:#7dd3fc;">${esc(t.category)}</h4><p>${t.tools.map(tool=>esc(tool)).join(', ')}</p></div>`).join('')}
            </div>`;

        // Education
        document.getElementById('education').innerHTML = d.education ? `
            ${sh('Education')}
            <div class="edu-grid">
                ${d.education.map(e=>`<div class="small-card edu-item"><h4>${esc(e.degree)}</h4><p>${esc(e.institution)}, ${esc(e.location)}</p></div>`).join('')}
            </div>` : '';

        // Footer
        document.getElementById('footer-content').innerHTML = `
            <p class="footer-text">${esc(d.footer.tagline)} ${esc(d.research.stats.patents)} patents. ${esc(d.research.stats.citations)} citations.</p>
            <div class="footer-links">${d.profiles.filter(p=>p.platform!=='Linktree').map(p=>`<a href="${esc(p.url)}" target="_blank">${esc(p.platform)}</a>`).join('')}</div>`;
    }
    </script>
    <script data-goatcounter="https://brettleehari.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
