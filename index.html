    <style>
        :root {
            --bg: #FAF6F0;
            --card: #FEFCF9;
            --soft: #F1EBE2;
            --fg: #2B2420;
            --fg-2: #4A4038;
            --muted: #6E645C;
            --faint: #9A8F85;
            --border: #E3DCD2;
            --border-strong: #CFC6BA;
            --accent: #D9481A;
            --accent-deep: #B23A13;
            --accent-soft: rgba(217,72,26,0.08);
            --accent-fg: #FEFCF9;
            --ink: #2B2420;
            --ink-fg: #FAF6F0;
            --amber: #B45309;
            --amber-soft: rgba(217,119,6,0.10);
            --amber-border: rgba(217,119,6,0.30);
            --display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
            --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --mono: 'SF Mono', 'Menlo', ui-monospace, monospace;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: var(--sans); background: var(--bg); color: var(--fg); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.02em; line-height: 1.15; }
        a { color: var(--accent-deep); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--accent); }
        button { font-family: inherit; }
        .wide { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .narrow { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

        /* Header */
        header {
            padding: 14px 0; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: rgba(250,246,240,0.92);
            backdrop-filter: blur(12px); z-index: 100;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .logo { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--fg); cursor: pointer; }
        nav { display: flex; gap: 2px; flex-wrap: wrap; }
        nav a { font-size: 13px; color: var(--muted); padding: 4px 9px; border-radius: 6px; transition: all 0.2s; }
        nav a:hover { color: var(--fg); background: var(--soft); }

        /* Hero */
        .hero {
            display: grid; grid-template-columns: 1fr auto; gap: 48px; align-items: center;
            padding: 72px 0 40px; animation: rise 0.8s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
        .hero .eyebrow-name { font-size: 14px; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 500; }
        .hero h1 { font-size: clamp(38px, 5.4vw, 64px); font-weight: 700; line-height: 1.05; color: var(--fg); margin-top: 14px; max-width: 14ch; }
        .hero .proof { font-size: clamp(16px, 1.6vw, 19px); color: var(--muted); max-width: 40rem; margin-top: 22px; line-height: 1.55; }
        .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
        .btn {
            display: inline-block; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
            border: 1px solid var(--border-strong); color: var(--fg); background: transparent; transition: all 0.2s; cursor: pointer;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
        .btn-primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .btn-accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
        .btn-accent:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--accent-fg); }
        .hero-links { display: none; gap: 12px 18px; flex-wrap: wrap; margin-top: 24px; }
        .hero-links a { font-size: 14px; color: var(--fg-2); text-underline-offset: 4px; }
        .hero-links a:hover { color: var(--accent); text-decoration: underline; }

        /* Profile wheel: photo in the centre, links orbiting it */
        .hero-visual {
            --size: 560px; --photo: 312px; --r: 236px; --ring: 48px; --spin: 56s;
            position: relative; width: var(--size); height: var(--size); flex-shrink: 0;
            display: grid; place-items: center; margin: 0 auto;
        }
        .hero-photo {
            width: var(--photo); height: var(--photo); border-radius: 50%; object-fit: cover; object-position: 50% 30%;
            position: relative; z-index: 2; border: 4px solid var(--card);
            box-shadow: 0 1px 2px rgba(43,36,32,0.06), 0 16px 40px rgba(43,36,32,0.14);
        }
        .orbit { position: absolute; inset: 0; animation: orbit-spin var(--spin) linear infinite; }
        .orbit::before {
            content: ''; position: absolute; inset: var(--ring); border-radius: 50%;
            border: 1px dashed var(--border-strong);
        }
        .orbit::after {
            content: ''; position: absolute; inset: calc(var(--ring) + 54px); border-radius: 50%;
            border: 1px solid var(--border); opacity: 0.7;
        }
        .orbit-item { position: absolute; top: 50%; left: 50%; width: 0; height: 0; transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))); }
        .orbit-fix { position: absolute; top: 0; left: 0; width: 0; height: 0; transform-origin: 0 0; animation: orbit-counter var(--spin) linear infinite; }
        .orbit-chip {
            position: absolute; top: 0; left: 0; transform: translate(-50%, -50%);
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
            padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border-strong);
            font-size: 13px; font-weight: 600; color: var(--fg-2); letter-spacing: 0.01em;
            box-shadow: 0 2px 10px rgba(43,36,32,0.08);
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
            animation: chip-in 0.6s cubic-bezier(0.2,0.7,0.2,1) both; animation-delay: calc(0.35s + var(--i) * 90ms);
        }
        .orbit-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
        .orbit-chip:hover, .orbit-chip:focus-visible { color: var(--accent); border-color: var(--accent); box-shadow: 0 6px 18px rgba(217,72,26,0.18); }
        .hero-visual:hover .orbit, .hero-visual:hover .orbit-fix,
        .hero-visual:focus-within .orbit, .hero-visual:focus-within .orbit-fix { animation-play-state: paused; }
        @keyframes orbit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orbit-counter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        @keyframes chip-in { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .orbit, .orbit-fix { animation: none; }
            .orbit-chip { animation: none; }
            .hero { animation: none; }
            .float-track { animation: none; flex-wrap: wrap; width: auto; }
            .float-card { animation: none; }
            .float-track .float-card.dup { display: none; }
            .reach-card, .reach-card::before, .reach-icon { animation: none; transition: none; }
        }

        /* Proof strip */
        .proof-strip {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border);
            border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 8px 0 0;
        }
        .proof-tile { background: var(--card); padding: 22px 24px; color: inherit; transition: background 0.2s; display: block; }
        a.proof-tile:hover { background: var(--soft); color: inherit; }
        .proof-tile .num { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--fg); line-height: 1.1; }
        .proof-tile .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .proof-tile .go { display: inline-block; margin-left: 6px; font-size: 20px; color: var(--accent); transition: transform 0.2s; }
        a.proof-tile:hover .go { transform: translate(2px, -2px); }

        /* Sections */
        section { padding: 64px 0 8px; margin-bottom: 24px; }
        section + section { border-top: 1px solid var(--border); }
        .section-header { margin-bottom: 28px; }
        .section-header h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; color: var(--fg); margin-top: 10px; }
        .section-sub { font-size: 15px; color: var(--muted); margin-top: 8px; max-width: 48rem; }

        /* Featured work */
        .feat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .feat-card {
            display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .feat-card:hover { border-color: var(--border-strong); box-shadow: 0 8px 24px rgba(43,36,32,0.06); }
        .feat-card.award { border-color: var(--amber-border); background: linear-gradient(180deg, rgba(217,119,6,0.05), var(--card) 40%); }
        .feat-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
        .feat-top .theme { color: var(--accent); }
        .feat-card h3 { font-size: 23px; font-weight: 700; color: var(--fg); margin-top: 12px; }
        .feat-award { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); background: var(--amber-soft); border: 1px solid var(--amber-border); border-radius: 4px; padding: 2px 7px; margin-left: 8px; vertical-align: middle; }
        .feat-card dl { margin-top: 16px; display: grid; gap: 8px; font-size: 14px; line-height: 1.55; }
        .feat-card dt { display: inline; font-weight: 700; color: var(--fg); }
        .feat-card dd { display: inline; color: var(--muted); }
        .feat-links { margin-top: auto; padding-top: 22px; display: flex; gap: 18px; flex-wrap: wrap; }
        .feat-card .feat-link { font-size: 14px; font-weight: 600; color: var(--fg); }
        .feat-card .feat-link:hover { color: var(--accent); }

        /* Floating strip of all work */
        .float-wrap {
            overflow: hidden; padding: 16px 0 14px; margin-bottom: 26px;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
        }
        .float-track { display: flex; gap: 20px; width: max-content; animation: float-scroll var(--float-dur, 70s) linear infinite; }
        .float-wrap:hover .float-track, .float-wrap:focus-within .float-track { animation-play-state: paused; }
        .float-card {
            flex: none; width: 360px; min-height: 230px; display: flex; flex-direction: column; gap: 8px;
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 24px 20px;
            color: inherit; box-shadow: 0 1px 2px rgba(43,36,32,0.04);
            animation: float-bob 5.5s ease-in-out infinite; animation-delay: calc(var(--i) * -0.9s);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .float-card:hover { border-color: var(--accent); box-shadow: 0 10px 26px rgba(43,36,32,0.10); color: inherit; }
        .float-card .fc-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
        .float-card .fc-top .fc-status { color: var(--faint); font-weight: 600; }
        .float-card h4 { font-size: 21px; font-weight: 700; color: var(--fg); line-height: 1.2; margin-top: 4px; }
        .float-card p { font-size: 14px; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .float-card .fc-go { margin-top: auto; padding-top: 12px; font-size: 14px; font-weight: 600; color: var(--fg-2); }
        .float-card:hover .fc-go { color: var(--accent); }
        .float-hint { font-size: 12px; color: var(--faint); margin: -8px 0 18px; }
        @keyframes float-scroll { from { transform: translateX(0); } to { transform: translateX(calc(-50% - 10px)); } }
        @keyframes float-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

        /* Award spotlight */
        .award-banner {
            display: flex; gap: 18px; align-items: flex-start;
            background: linear-gradient(90deg, rgba(217,119,6,0.09), rgba(217,119,6,0.02));
            border: 1px solid var(--amber-border); border-left: 3px solid var(--amber);
            border-radius: var(--radius); padding: 24px 26px;
        }
        .award-banner .award-medal { font-size: 26px; line-height: 1; flex: none; }
        .award-banner .award-placement { font-size: 11px; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
        .award-banner h3 { font-size: 20px; font-weight: 700; color: var(--fg); margin-bottom: 4px; }
        .award-banner .award-meta { font-size: 13px; color: var(--fg-2); margin-bottom: 8px; }
        .award-banner p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
        .award-banner .award-scale { font-size: 12px; color: var(--amber); font-weight: 600; font-family: var(--mono); margin-bottom: 12px; }
        .award-banner .award-solo { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: var(--ink-fg); background: var(--amber); border-radius: 3px; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
        .award-banner .award-note { font-size: 14px; color: var(--fg-2); line-height: 1.65; margin-bottom: 10px; padding-left: 14px; border-left: 2px solid var(--amber-border); }
        .award-banner .award-note span { color: var(--fg); font-weight: 700; }
        .award-banner .award-links { display: flex; gap: 16px; flex-wrap: wrap; }
        .award-banner .award-links a { font-size: 13px; font-weight: 600; color: var(--amber); }

        /* Journey */
        .lane-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .lane-tab {
            padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--fg-2);
            border: 1px solid var(--border-strong); border-radius: 999px; background: transparent; transition: all 0.2s;
        }
        .lane-tab:hover { border-color: var(--accent); color: var(--accent); }
        .lane-tab.active { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
        .lane-tab .tab-count { display: inline-block; font-size: 11px; background: var(--soft); color: var(--muted); padding: 1px 7px; border-radius: 8px; margin-left: 6px; }
        .lane-tab.active .tab-count { background: rgba(255,255,255,0.16); color: var(--ink-fg); }
        .lane-panel { display: none; padding: 20px 0; }
        .lane-panel.active { display: block; }
        .lane-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
        .lc {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
            cursor: pointer; transition: all 0.2s; border-left: 3px solid var(--lane-color, var(--accent));
        }
        .lc:hover { border-color: var(--border-strong); border-left-color: var(--lane-color, var(--accent)); box-shadow: 0 6px 18px rgba(43,36,32,0.05); }
        .lc .lc-year { font-size: 11px; font-weight: 700; color: var(--lane-color, var(--accent)); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
        .lc h4 { font-size: 16px; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
        .lc .lc-oneliner { font-size: 14px; color: var(--muted); line-height: 1.5; }
        .lc .lc-primary-link { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--lane-color, var(--accent)); }
        .lc .lc-primary-link:hover { opacity: 0.8; }
        .lc .lc-hint { font-size: 11px; color: var(--faint); margin-top: 6px; }
        .lc.open .lc-hint { display: none; }
        .lc .lc-detail { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .lc.open .lc-detail { max-height: 700px; }
        .lc .lc-detail p { font-size: 13px; color: var(--fg-2); line-height: 1.6; margin-top: 12px; }
        .lc .lc-detail .lc-insight { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 8px; }
        .lc .lc-results { font-size: 12px; color: var(--lane-color, var(--accent)); font-weight: 600; margin-top: 8px; font-family: var(--mono); }
        .lc .lc-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .lc .lc-links a { font-size: 12px; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--fg-2); transition: all 0.2s; }
        .lc .lc-links a:hover { border-color: var(--accent); color: var(--accent); }
        .lc .lc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .lc .lc-tags span { font-size: 11px; background: var(--soft); color: var(--muted); padding: 2px 7px; border-radius: 4px; }

        [data-lane="oss"] { --lane-color: #15803D; }
        [data-lane="live"] { --lane-color: #1D4ED8; }
        [data-lane="entrepreneur"] { --lane-color: #B91C1C; }
        [data-lane="research"] { --lane-color: #7E22CE; }
        [data-lane="public"] { --lane-color: #B45309; }

        /* Beliefs */
        .beliefs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px 32px; }
        .belief-item { padding: 0; }
        .belief-num { font-family: var(--display); font-size: 13px; color: var(--accent); font-weight: 600; }
        .belief-text { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--fg); margin-top: 6px; line-height: 1.25; }
        .belief-sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
        .ghost-btn { margin-top: 24px; background: none; border: 1px solid var(--border-strong); border-radius: 999px; color: var(--fg-2); font-size: 13px; padding: 7px 16px; cursor: pointer; transition: all 0.2s; }
        .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Research */
        .bg-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }
        .bg-card p { font-size: 15px; line-height: 1.75; color: var(--fg-2); }
        .bg-card .insight { margin-top: 12px; font-style: italic; color: var(--muted); font-size: 14px; }
        .stats-row { display: flex; gap: 32px; margin-top: 20px; flex-wrap: wrap; }
        .stat { text-align: left; }
        .stat-number { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--fg); }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .stat-go { font-family: var(--display); font-size: 17px; font-weight: 700; color: var(--fg); display: inline-block; margin-top: 4px; border-bottom: 2px solid var(--accent); line-height: 1.5; }
        .stat-go:hover { color: var(--accent); }
        .subhead { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.14em; margin: 28px 0 12px; }
        .subhead:first-of-type { margin-top: 0; }
        .fw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .fw-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .fw-item h4 { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
        .fw-item p { font-size: 13px; color: var(--muted); line-height: 1.5; }
        .pill-row { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
        .pill { font-size: 13px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 999px; color: var(--fg-2); }
        .pill:hover { border-color: var(--accent); color: var(--accent); }

        /* Book + shelf */
        .book-card { display: flex; gap: 22px; align-items: center; background: linear-gradient(90deg, rgba(217,119,6,0.07), var(--card)); border: 1px solid var(--amber-border); border-radius: var(--radius); padding: 24px; margin-bottom: 8px; }
        .book-icon { font-size: 36px; opacity: 0.8; }
        .book-info h3 { font-size: 19px; font-weight: 700; color: var(--fg); margin-bottom: 3px; }
        .book-info .book-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .book-info p { font-size: 14px; color: var(--fg-2); line-height: 1.6; }
        .shelf-tabs { display: flex; gap: 0; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .shelf-tab { background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 13px; color: var(--muted); padding: 8px 12px; transition: all 0.2s; }
        .shelf-tab:hover { color: var(--fg); }
        .shelf-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .shelf-tab .tab-count { display: inline-block; font-size: 11px; background: var(--soft); color: var(--muted); padding: 1px 7px; border-radius: 8px; margin-left: 4px; }
        .shelf-panel { display: none; }
        .shelf-panel.active { display: block; }
        .shelf-why { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 10px; }
        .shelf-note { font-size: 14px; color: var(--muted); line-height: 1.7; background: var(--card); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 16px; }
        .shelf-book .author { font-size: 12px; color: var(--accent); margin-bottom: 4px; }

        /* Small cards (speaking, writing, now, reading, tech, education) */
        .small-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
        .small-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: border-color 0.2s; }
        .small-card:hover { border-color: var(--border-strong); }
        .small-card h4 { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
        .small-card h4 a { color: var(--fg); }
        .small-card h4 a:hover { color: var(--accent); }
        .small-card .meta { font-size: 12px; color: var(--accent); margin-bottom: 6px; }
        .small-card p { font-size: 13px; color: var(--muted); line-height: 1.55; }
        .small-card .card-head { color: var(--accent); }
        .chip { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin-left: 6px; vertical-align: middle; letter-spacing: 0.04em; text-transform: uppercase; }
        .chip-upcoming { background: rgba(21,128,61,0.12); color: #15803D; }
        .chip-recurring { background: var(--amber-soft); color: var(--amber); }
        .chip-past { background: var(--soft); color: var(--muted); }

        /* Speaking */
        .talk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .talk-card { display: flex; flex-direction: column; overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
        .talk-card:hover { border-color: var(--border-strong); box-shadow: 0 8px 24px rgba(43,36,32,0.06); color: inherit; }
        .talk-visual { display: block; overflow: hidden; background: var(--ink); }
        .talk-card img { aspect-ratio: 16/9; width: 100%; object-fit: cover; object-position: 50% 30%; display: block; transition: transform 0.4s cubic-bezier(0.2,0.7,0.2,1); }
        .talk-visual:hover img { transform: scale(1.03); }
        .talk-body .talk-topic { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
        .talk-body h3 a { color: inherit; }
        .talk-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .talk-links a { font-size: 12px; font-weight: 600; padding: 5px 11px; border: 1px solid var(--border-strong); border-radius: 999px; color: var(--fg-2); }
        .talk-links a:hover { border-color: var(--accent); color: var(--accent); }
        .talk-poster { aspect-ratio: 16/9; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; background: var(--ink); color: var(--ink-fg); padding: 28px; }
        .talk-poster .big { font-family: var(--display); font-size: 48px; font-weight: 700; color: var(--accent); line-height: 1; }
        .talk-poster .sub { font-family: var(--display); font-size: 22px; font-weight: 700; margin-top: 8px; line-height: 1.2; }
        .talk-body { padding: 20px 22px 22px; }
        .talk-body .ev { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
        .talk-body h3 { font-size: 20px; font-weight: 700; color: var(--fg); margin-top: 8px; }
        .talk-card:hover h3 { color: var(--accent); }
        .reading-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
        .reading-card ul { list-style: none; padding: 0; }
        .reading-card li { font-size: 13px; color: var(--fg-2); padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.5; }
        .reading-card li:last-child { border-bottom: none; }
        .reading-card li strong { color: var(--fg); }
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }

        /* Contact / Reach out */
        #contact h2 { font-size: clamp(34px, 4.6vw, 56px); line-height: 1.05; max-width: 16ch; }
        .contact-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
        .contact-sub { font-size: 15px; color: var(--muted); margin-top: 18px; max-width: 40rem; }
        .reach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 36px; }
        .reach-card { --brand: var(--accent); position: relative; display: flex; flex-direction: column; gap: 10px; padding: 24px 22px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; color: var(--fg); text-decoration: none; overflow: hidden; isolation: isolate; transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .35s; animation: reach-in .6s both; animation-delay: calc(var(--i) * 110ms); }
        .reach-card::before { content: ''; position: absolute; inset: -40%; z-index: -1; background: radial-gradient(closest-side, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%); opacity: 0; transform: translate(30%, 30%) scale(.6); transition: opacity .45s, transform .6s cubic-bezier(.2,.8,.2,1); }
        .reach-card:hover, .reach-card:focus-visible { transform: translateY(-6px); border-color: var(--brand); box-shadow: 0 18px 40px -22px color-mix(in srgb, var(--brand) 60%, transparent); outline: none; }
        .reach-card:hover::before, .reach-card:focus-visible::before { opacity: 1; transform: translate(0,0) scale(1); }
        .reach-head { display: flex; align-items: center; gap: 12px; }
        .reach-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--brand); color: #fff; flex: none; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
        .reach-icon svg { width: 24px; height: 24px; fill: currentColor; }
        .reach-card:hover .reach-icon { transform: rotate(-8deg) scale(1.08); }
        .reach-head h3 { font-family: var(--display); font-size: 19px; line-height: 1.1; margin: 0; color: var(--fg); transition: color .3s; }
        .reach-card:hover .reach-head h3 { color: var(--brand); }
        .reach-handle { font-size: 13px; color: var(--muted); margin-top: 3px; }
        .reach-card p { font-size: 14px; color: var(--fg-2); line-height: 1.5; margin: 0; flex: 1; }
        .reach-go { font-size: 14px; font-weight: 600; color: var(--brand); display: inline-flex; align-items: center; gap: 6px; }
        .reach-go::after { content: '\2192'; transition: transform .3s; }
        .reach-card:hover .reach-go::after { transform: translateX(5px); }
        @keyframes reach-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        footer { border-top: 1px solid var(--border); padding: 32px 0 40px; margin-top: 40px; }
        .footer-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
        .footer-text { font-size: 13px; color: var(--muted); }
        .footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
        .footer-links a { font-size: 13px; color: var(--muted); }
        .footer-links a:hover { color: var(--accent); }

        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; gap: 20px; padding-top: 36px; }
            .hero-visual { --size: 400px; --photo: 210px; --r: 164px; --ring: 34px; order: -1; }
            .hero-visual .orbit::after { display: none; }
            .orbit-chip { font-size: 12px; padding: 6px 11px; }
            .float-card { width: 300px; }
            .proof-strip { grid-template-columns: repeat(2, 1fr); }
            .feat-grid, .talk-grid { grid-template-columns: 1fr; }
            .lane-cards { grid-template-columns: 1fr; }
            nav a { font-size: 12px; padding: 3px 7px; }
            .book-card { flex-direction: column; align-items: flex-start; }
            section { padding-top: 48px; }
            .wide, .narrow, .header-content { padding: 0 16px; }
        }
        @media (max-width: 600px) {
            .header-content { flex-direction: column; align-items: flex-start; gap: 6px; }
            .hero-visual { --size: 220px; --photo: 204px; }
            .orbit { display: none; }
            .hero-links { display: flex; }
        }

        .skip-link { position: absolute; left: -9999px; }
        .skip-link:focus { left: 12px; top: 12px; background: var(--ink); color: var(--ink-fg); padding: 6px 10px; border-radius: 4px; z-index: 200; font-size: 13px; }

        @media print {
            body { background: #fff; color: #111; }
            header, footer, nav, .lane-tabs, .skip-link, .hero-links, .hero-cta, .lc-hint, .contact-actions, .orbit { display: none; }
            .hero { grid-template-columns: 1fr; animation: none; }
            .hero-visual { --size: 180px; --photo: 164px; }
            .lane-panel { display: block !important; margin-bottom: 24px; }
            .lc, .feat-card, .small-card, .fw-item, .bg-card, .talk-card { border: 1px solid #ddd; break-inside: avoid; }
            .lc .lc-detail { max-height: none !important; }
            a { color: #111; text-decoration: underline; }
        }
    </style>
</head>
<body>
    <a href="#work" class="skip-link">Skip to content</a>
    <header><div class="header-content">
        <div class="logo" id="site-name"></div>
        <nav id="nav-links"></nav>
    </div></header>

    <div class="wide">
        <section class="hero" id="hero-row"></section>
        <div class="proof-strip" id="proof-strip"></div>
    </div>

    <div class="wide">
        <section id="work"></section>
        <section id="spotlight"></section>
        <section id="journey"></section>
    </div>

    <div class="narrow">
        <section id="believe"></section>
        <section id="background"></section>
        <section id="books"></section>
        <section id="speaking"></section>
        <section id="write"></section>
        <section id="now"></section>
        <section id="read"></section>
        <section id="tech"></section>
        <section id="education"></section>
        <section id="contact"></section>
    </div>

    <footer><div class="narrow footer-row" id="footer-content"></div></footer>

    <script>
    fetch('data/portfolio.json').then(r=>r.json()).then(render).catch(()=>{
        document.querySelector('.wide').innerHTML='<p style="text-align:center;padding:80px 20px;color:#6E645C;">Failed to load portfolio data.</p>';
    });

    function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
    function sh(label,t,sub){return `<div class="section-header"><p class="eyebrow">${esc(label)}</p>${t?`<h2>${esc(t)}</h2>`:''}${sub?`<p class="section-sub">${esc(sub)}</p>`:''}</div>`;}
    const SCHOLAR='https://scholar.google.com/citations?hl=en&user=0ifJK1sAAAAJ';
    const PLATFORM_COLOR={'GitHub':'#24292F','LinkedIn':'#0A66C2','Substack':'#FF6719','Medium':'#1A1A1A','Hugging Face':'#F5A623','Google Scholar':'#4285F4','ResearchGate':'#00A98F'};

    function render(d) {
        document.getElementById('site-name').textContent = d.site.name;
        document.title = `${d.person.full_name} — ${(d.person.hero_headline || d.person.headline).replace(/\.$/,'')}`;

        const nav=[['work','Work'],['journey','Journey'],['believe','Beliefs'],['background','Research'],['books','Bookshelf'],['speaking','Speaking'],['write','Write'],['now','Now'],['tech','Stack'],['contact','Reach out']];
        document.getElementById('nav-links').innerHTML=nav.map(([id,l])=>`<a href="#${id}">${l}</a>`).join('');

        const award = (d.awards || [])[0];
        const li = d.profiles.find(p=>p.platform==='LinkedIn');
        const gh = d.profiles.find(p=>p.platform==='GitHub');
        const contactHref = d.person.email ? `mailto:${d.person.email}` : (li ? li.url : '#');
        const rg = d.profiles.find(p=>p.platform==='ResearchGate');
        const wheel = d.profiles.filter(p=>p.platform!=='Linktree');

        // Hero
        document.getElementById('hero-row').innerHTML = `
            <div class="hero-text">
                <p class="eyebrow-name">${esc(d.person.full_name)} &middot; ${esc(d.person.current_location)}</p>
                <h1>${esc(d.person.hero_headline || d.person.headline)}</h1>
                <p class="proof">${esc(d.person.hero_proof || d.person.headline)}</p>
                <div class="hero-cta">
                    <a class="btn btn-primary" href="#work">See my work</a>
                    <a class="btn" href="#contact">Get in touch</a>
                </div>
                <div class="hero-links">
                    ${wheel.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noreferrer">${esc(p.platform)}</a>`).join('')}
                </div>
            </div>
            <div class="hero-visual">
                <div class="orbit" aria-label="Profiles">
                    ${wheel.map((p,i)=>`<div class="orbit-item" style="--a:${(-90 + i*360/wheel.length).toFixed(2)}deg"><div class="orbit-fix"><a class="orbit-chip" style="--i:${i}" href="${esc(p.url)}" target="_blank" rel="noreferrer"><span class="dot" style="background:${PLATFORM_COLOR[p.platform]||'var(--accent)'}"></span>${esc(p.platform)}</a></div></div>`).join('')}
                </div>
                <img class="hero-photo" src="/Hari.me/assets/profile.jpg" width="312" height="312" alt="${esc(d.person.full_name)}">
            </div>`;

        // Proof strip
        const st = d.research.stats;
        const tiles = [
            {v:'Patents', go:true, l:'Granted. Read them on Google Scholar', h:SCHOLAR},
            {v:'Research', go:true, l:'Papers and citations on ResearchGate', h: rg ? rg.url : SCHOLAR},
            award ? {v:award.placement, l:`MIT NANDAHack, solo, of 230+`, h:award.url} : {v:'Papers', go:true, l:'Published work on Google Scholar', h:SCHOLAR},
            {v:st.merged_prs || '6', l:'Merged open-source PRs', h: gh ? gh.url : '#'},
        ];
        document.getElementById('proof-strip').innerHTML = tiles.map(t =>
            `<a class="proof-tile" href="${esc(t.h)}" target="_blank" rel="noreferrer"><div class="num">${esc(t.v)}${t.go?'<span class="go">&nearr;</span>':''}</div><div class="lbl">${esc(t.l)}</div></a>`
        ).join('');

        // Featured work: Problem / Built / Result
        const featured = d.projects.filter(p=>p.pinned).sort((a,b)=>a.featured_order-b.featured_order).slice(0,4);
        const featuredHtml = featured.map(p => {
            const pt = p.pitch || {};
            const link = p.demo_url || p.model_url || p.repo_url || p.writeup_url || '';
            const linkLabel = pt.cta || (p.demo_url ? 'Live app' : p.model_url ? 'Model' : p.repo_url ? 'GitHub' : 'Announcement');
            const title = pt.title || p.name.split(' — ')[0];
            return `<article class="feat-card${p.award ? ' award' : ''}">
                <div class="feat-top"><span class="theme">${esc(pt.theme || 'Project')}</span><span>${esc(p.year_started)}</span></div>
                <h3>${esc(title)}${p.award ? '<span class="feat-award">Award</span>' : ''}</h3>
                <dl>
                    <div><dt>Problem. </dt><dd>${esc(pt.problem || p.problem)}</dd></div>
                    <div><dt>Built. </dt><dd>${esc(pt.built || p.what_it_does)}</dd></div>
                    <div><dt>Result. </dt><dd>${esc(pt.result || p.results)}</dd></div>
                </dl>
                <div class="feat-links">
                    ${p.video_url ? `<a href="${esc(p.video_url)}" target="_blank" rel="noreferrer" class="feat-link">&#9654;&#xFE0E; Demo video</a>` : ''}
                    ${link ? `<a href="${esc(link)}" target="_blank" rel="noreferrer" class="feat-link">${esc(linkLabel)} &rarr;</a>` : ''}
                </div>
            </article>`;
        }).join('');
        const allWork = d.projects.filter(p => p.name).sort((a,b)=>(a.featured_order||99)-(b.featured_order||99) || a.name.localeCompare(b.name));
        const workKind = p => p.demo_url ? 'Live app' : p.model_url ? 'Model' : p.video_url ? 'Demo video' : p.repo_url ? 'GitHub' : p.writeup_url ? 'Read' : '';
        const workHref = p => p.demo_url || p.model_url || p.video_url || p.repo_url || p.writeup_url || '#';
        const floatCard = (p, i, dup) => `<a class="float-card${dup ? ' dup' : ''}" style="--i:${i}" href="${esc(workHref(p))}" target="_blank" rel="noreferrer"${dup ? ' aria-hidden="true" tabindex="-1"' : ''}>
                <div class="fc-top"><span>${esc((p.pitch && p.pitch.theme) || (p.award ? 'Award' : 'Project'))}</span><span class="fc-status">${esc(p.status || '')}</span></div>
                <h4>${esc((p.pitch && p.pitch.title) || p.name.split(' — ')[0])}</h4>
                <p>${esc(p.one_liner || '')}</p>
                <span class="fc-go">${esc(workKind(p))} &rarr;</span></a>`;
        const floatHtml = allWork.map((p,i)=>floatCard(p,i,false)).join('') + allWork.map((p,i)=>floatCard(p,i,true)).join('');
        document.getElementById('work').innerHTML = `
            ${sh('Featured work', '', d.person.hero_motto || '')}
            <div class="float-wrap"><div class="float-track" style="--float-dur:${Math.max(50, allWork.length * 11)}s">${floatHtml}</div></div>
            <p class="float-hint">Everything I have shipped, drifting by. Hover to pause, click to open. The four below get the full story.</p>
            <div class="feat-grid">${featuredHtml}</div>`;

        // Spotlight: award narrative
        const awardsHtml = (d.awards || []).map(a => {
            const links = [
                a.video_url ? {label:'Demo video', url:a.video_url} : null,
                a.url ? {label:'Announcement (MIT Media Lab)', url:a.url} : null,
                a.demo_url ? {label:'Live application', url:a.demo_url} : null,
                a.repo_url ? {label:'GitHub', url:a.repo_url} : null,
            ].filter(Boolean);
            return `<div class="award-banner">
                <div class="award-medal" aria-hidden="true">&#127942;</div>
                <div>
                    <div class="award-placement">${esc(a.placement)} &middot; ${esc(a.event)}${a.format ? ` <span class="award-solo">${esc(a.format)}</span>` : ''}</div>
                    <h3>${esc(a.title)}</h3>
                    <div class="award-meta">${esc(a.host)} &middot; ${esc(a.date)}${a.location ? ' &middot; ' + esc(a.location) : ''}</div>
                    ${a.one_liner ? `<p>${esc(a.one_liner)}</p>` : ''}
                    ${a.scale ? `<div class="award-scale">${esc(a.scale)}</div>` : ''}
                    ${a.why_i_entered ? `<p class="award-note"><span>Why I entered.</span> ${esc(a.why_i_entered)}</p>` : ''}
                    ${a.what_i_learned ? `<p class="award-note"><span>What I took from it.</span> ${esc(a.what_i_learned)}</p>` : ''}
                    ${links.length ? `<div class="award-links">${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label)} &rarr;</a>`).join('')}</div>` : ''}
                </div>
            </div>`;
        }).join('');
        const spot = document.getElementById('spotlight');
        if (awardsHtml) spot.innerHTML = `${sh('Spotlight')}${awardsHtml}`; else spot.remove();

        // ===== 5-LANE JOURNEY =====
        const ossItems = d.open_source.map(o => ({
            year: o.year || '', title: o.project, oneliner: o.contribution,
            desc: o.significance || '', links: o.url ? [{label:'View PR / Repo', url:o.url}] : [], tags: []
        }));

        const liveItems = d.projects.filter(p => p.demo_url || p.model_url || p.dataset_url).map(p => ({
            year: p.year_started, title: p.name, oneliner: p.one_liner,
            desc: p.what_it_does, insight: p.what_i_learned, results: p.results,
            links: [
                p.demo_url ? {label:'Live application',url:p.demo_url} : null,
                p.repo_url ? {label:'GitHub',url:p.repo_url} : null,
                p.writeup_url ? {label:'Write-up',url:p.writeup_url} : null,
                p.model_url ? {label:'Model',url:p.model_url} : null,
                p.dataset_url ? {label:'Dataset',url:p.dataset_url} : null,
            ].filter(Boolean),
            tags: p.tech_stack || []
        }));

        const entrepreneurItems = [
            {
                year: '2015', title: 'Uber Fleet Management Venture, Chennai',
                oneliner: 'Developed an overlay application for fleet management, coordination, driver scheduling, and earnings optimization.',
                desc: 'Actively used the application and shared with others managing a fleet with GPS for coordination, fuel, maintenance, depreciation providing a clear P&L per car per driver based on changing Uber incentive systems.',
                links: [], tags: []
            },
            {
                year: '2019', title: 'Smart-Review on GitHub Marketplace',
                oneliner: 'Developed a suite of DevTools to be launched in GitHub Marketplace.',

            <p class="contact-sub">Product, fine-tuning, agents, or the full stack around the model. If you have a real problem and want a builder in the room, I would like to hear about it. Pick whichever door you like.</p>
            <div class="reach-grid">${reach.map((r,i)=>`<a class="reach-card" style="--i:${i};--brand:${REACH_COLOR[r.platform]||'var(--accent)'}" href="${esc(r.url)}" target="_blank" rel="noreferrer"><div class="reach-head"><span class="reach-icon">${REACH_ICON[r.platform]||''}</span><div><h3>${esc(r.platform)}</h3><div class="reach-handle">${esc(r.handle||'')}</div></div></div><p>${esc(r.blurb||'')}</p><span class="reach-go">${esc(r.cta||'Open')}</span></a>`).join('')}</div>
            <div class="contact-actions">
                <a class="btn btn-accent" href="${esc(contactHref)}">${d.person.email ? 'Email me' : 'Message me on LinkedIn'}</a>
                ${li && d.person.email && !reach.some(r => r.platform === 'LinkedIn') ? `<a class="btn" href="${esc(li.url)}" target="_blank" rel="noreferrer">Message me on LinkedIn</a>` : ''}
            </div>`;

        // Footer
        document.getElementById('footer-content').innerHTML = `
            <p class="footer-text">&copy; ${esc(d.person.full_name)}. ${esc(d.footer.tagline)}</p>
            <div class="footer-links">${d.profiles.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noreferrer">${esc(p.platform)}</a>`).join('')}</div>`;
    }
    </script>
    <script data-goatcounter="https://brettleehari.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
